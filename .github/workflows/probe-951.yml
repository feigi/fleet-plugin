name: probe-951

on: push

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Flooded-child probe
        run: node probe-951.mjs
      - name: Gate under test, unskipped
        run: node --test skills/fleet/scripts/board-cli.test.mjs
