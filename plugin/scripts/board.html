<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fleet cockpit</title>
<style>
  :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --line:#30363d;
    --fg:#e6edf3; --dim:#8b949e; --red:#f85149; --amber:#d29922; --green:#3fb950; --blue:#58a6ff; }
  * { box-sizing: border-box; }
  /* The page is the window's height (#1759): header, banner, attention strip,
     spend panel and footer keep their natural height and never shrink; #board
     takes the rest, and each column scrolls on its own past that. The board's
     min-height is the floor for a window too short for the fixed parts — they
     then overflow body and the PAGE scrolls, rather than squeezing the
     columns to nothing or clipping anything off. */
  body { margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
    height:100vh; display:flex; flex-direction:column; }
  /* Belt-and-braces: a flex item's own min-height:auto already stops it
     shrinking below its content, so nothing here strictly needs flex:none to
     hold its height — #board's own min-height:200px is what actually floors
     the layout. Costs nothing to keep, and guards against a future rule on
     any of these six children that would otherwise let it shrink. */
  body > * { flex:none; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  #age { color:var(--dim); font-size:12px; margin-left:auto; }
  #stale-banner { display:none; background:var(--amber); color:#000; padding:6px 16px; font-weight:600; }
  /* A stopped RUN, not stale data: red, because the fleet is not working and
     its claimed tickets are stranded behind a label the next run's scan skips. */
  #stale-banner.dead { background:var(--red); color:#fff; }
  #attention { padding:8px 16px; border-bottom:1px solid var(--line); background:#2d1618; }
  #attention:empty { display:none; }
  .att { display:inline-block; margin:2px 10px 2px 0; }
  .att .n { color:var(--blue); font-weight:600; }
  .flag { color:var(--red); font-weight:600; }
  #board { display:grid; grid-template-columns:repeat(5,1fr); grid-template-rows:minmax(0,1fr); gap:10px; padding:14px; align-items:start;
    flex:1 1 0; min-height:200px; }
  /* As tall as its content, capped at the board's height, then it scrolls. */
  .col { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px; min-height:80px;
    max-height:100%; overflow-y:auto; }
  /* Pinned while the cards scroll beneath. The negative margins stretch its
     opaque background to the column's padding edge so no card shows around
     it; the padding puts the text back exactly where the old margin had it.
     top is -8px, not 0, because Chromium measures a sticky offset from the
     scroller's padding edge — 0 would park it 8px down, cards showing above. */
  .col h2 { font-size:11px; letter-spacing:.06em; color:var(--dim); margin:-8px -8px 0; padding:10px 12px 8px; text-transform:uppercase;
    position:sticky; top:-8px; z-index:1; background:var(--panel); }
  .col h2 span { color:var(--fg); }
  .card { background:#0d1117; border:1px solid var(--line); border-radius:6px; padding:7px 8px; margin-bottom:7px; }
  .card .top { display:flex; gap:6px; align-items:baseline; }
  .card .n { color:var(--blue); font-weight:600; }
  .card .title { color:var(--fg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card .meta { color:var(--dim); font-size:12px; margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; }
  .card a { color:var(--blue); text-decoration:none; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; vertical-align:middle; }
  .dot.green{background:var(--green)} .dot.red{background:var(--red)} .dot.unknown{background:var(--dim)}
  .badge { border:1px solid var(--line); border-radius:10px; padding:0 6px; }
  .badge.flag { border-color:var(--red); color:var(--red); }
  footer { color:var(--dim); padding:10px 16px; border-top:1px solid var(--line); font-size:12px; }
  footer .filed { margin-top:4px; }
  #spend { padding:0 14px 14px; }
  #spend:empty { display:none; }
  .spend-wrap { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .spend-hd { display:flex; align-items:baseline; gap:10px; margin-bottom:8px; }
  .spend-hd h2 { font-size:11px; letter-spacing:.06em; color:var(--dim); margin:0; text-transform:uppercase; }
  .spend-hd .lede { color:var(--fg); }
  .spend-hd .note { color:var(--dim); font-size:11px; margin-left:auto; }
  .spend-cols { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:900px) { .spend-cols { grid-template-columns:1fr; } }
  .spend-cols h3 { font-size:11px; color:var(--dim); margin:0 0 6px; font-weight:600; letter-spacing:.04em; }
  .srow { display:grid; grid-template-columns:8.5em 3.4em 1fr 3em; gap:8px; align-items:center; margin-bottom:3px; font-size:12px; }
  .srow .lbl { color:var(--fg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .srow .num { color:var(--dim); text-align:right; }
  .srow .pct { color:var(--dim); text-align:right; }
  .bar { background:#0d1117; border-radius:3px; height:9px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--blue); }
  .bar i.rev { background:var(--amber); }
</style>
</head>
<body>
<header><h1 id="heading">🛰 fleet cockpit</h1><span id="age"></span></header>
<div id="stale-banner"></div>
<div id="attention"></div>
<div id="board"></div>
<div id="spend"></div>
<footer id="footer"></footer>
<script>
const COLUMNS = ["POOL", "IMPLEMENTING", "REVIEW", "READY", "MERGED"];
let interval = 15;
let repoUrl = null; // full repo URL from the model (carries the host) — PR links, GHE-safe
const colNodes = new Map(); // column name → its .col, built on the first render (see render)

// The instance's name, for the tab strip and the header (#1584). Two cockpits
// are two WORKSPACES, and until this the pair rendered one constant twice —
// the operator's only way to tell two open windows apart was to read the
// tickets on them. `repo` has ridden the payload since the board existed and
// nothing on the page ever read it.
//
// Truthiness, not a null check: `gh repo view` failing leaves gather()'s
// `repo` null, a malformed answer can leave it "", and the identity stub
// served before the first tick (#1660) carries no `repo` key at all. All
// three mean "this board cannot name its repo", and all three must render
// today's constant rather than `fleet cockpit — undefined`.
//
// Returned rather than assigned: this page is served as one self-contained
// file with no build and no DOM harness, so a decision is testable only as a
// pure function something can lift out of the source — the seam spendView and
// ledgerBanner already use.
const TITLE = "fleet cockpit";
function boardTitle(repo) { return repo ? `${TITLE} — ${repo}` : TITLE; }

const el = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const mins = (ms) => Math.floor((Date.now() - ms) / 60000);

// A run's headline is routinely tens of millions, where "48785k" is unreadable.
const k = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1000 ? (n / 1000).toFixed(0) + "k" : String(Math.round(n)));

function spendRows(host, items, { label, value, pct, highlight }) {
  for (const it of items) {
    const row = el("div", "srow");
    const lbl = el("span", "lbl", label(it));
    lbl.title = label(it); // the column ellipsises; long tool names are unreadable without this
    row.append(lbl, el("span", "num", value(it)));
    const bar = el("div", "bar");
    const fill = el("i", highlight?.(it) ? "rev" : null);
    fill.style.width = Math.max(1, Math.round(pct(it))) + "%";
    bar.append(fill);
    row.append(bar, el("span", "pct", pct(it).toFixed(0) + "%"));
    host.append(row);
  }
}

// Which of the spend panel's outcomes the tri-state `spend` contract lands on,
// and the strings that outcome needs — as a value, with no DOM touched. The
// branching lives here rather than in renderSpend below because this page has no
// other test seam: it is served as one self-contained file, so a test reaches
// this decision only by lifting it out of the source and calling it directly,
// which spend-view.test.mjs does. That gap is not academic — the falsy-cacheWrite
// case below shipped broken and its fix shipped untested, because until this
// split there was nothing a test could call (#371).
//
// `kind` is the tag the renderer switches on; "hidden" appends nothing at all.
// Both text-only outcomes carry the same `text` field because both render as one
// `spend-wrap` div, differing only in wording.
function spendView(sp) {
  // Shared by both the early note-only branch and the funded panel's note
  // below, so a rewording can't update one copy and silently miss the other.
  const metaErrorsPhrase = (n, suffix = "") => `${n} meta sidecar${n === 1 ? "" : "s"} corrupt${suffix}`;
  // #916's phrase, shared the same way and for the same reason. It names the
  // LINES, not the files: one transcript can hold several damaged lines, and
  // "1 transcript damaged" would read as a whole agent lost — which is what
  // `skipped` means and this does not.
  const damagedPhrase = (n, suffix = "") => `${n} damaged transcript line${n === 1 ? "" : "s"}${suffix}`;
  if (!sp) return { kind: "hidden" }; // genuinely nothing yet — normal at run start
  // A read failure is a bug the operator has to act on, and it used to look
  // exactly like an idle run. stderr is not a channel here: the board is
  // launched backgrounded and the operator is watching this page, not a log.
  //
  // Switch on `ok`, gatherSpend's explicit tag, and never on `error`. Reading
  // the error case off `error`'s truthiness was #959: `{ error: "" }` and
  // `{ error: undefined }` — both of which the producer's outer catch can emit,
  // from a message-less throw and a thrown non-Error — matched neither this
  // branch nor a success shape, so they fell through, found no totals, and HID
  // the panel. That is the fault-as-idle-run conflation this branch exists to
  // remove, reappearing one field over.
  //
  // `!sp.ok`, not `sp.ok === false`, so an UNTAGGED payload is an error too.
  // That direction is deliberate: an old `board.json` still on disk after an
  // upgrade renders a loud "spend unavailable" and self-heals on the next tick
  // (~15s), where the other bias would route a legacy `{ error: "…" }` to
  // hidden — trading a visible, temporary wrong answer for an invisible one.
  //
  // An empty or absent message loses only the wording, never the panel: the tag
  // has already decided. `|| "no reason given"` is `ledger.mjs`'s idiom for the
  // same shape ("gh failed without saying why").
  if (!sp.ok) return { kind: "error", text: "spend unavailable: " + (sp.error || "no reason given") };
  // Zeroes would read as "this run was free", a worse lie than absence — but a
  // skipped count is not a zero, and hiding it here re-created the exact
  // conflation this panel exists to remove: "3 of 4 transcripts unreadable"
  // rendered identically to "nothing yet". stderr does not cover it (see
  // above), so the note goes out on its own, without the zeroed two-column body.
  if (!sp.totals || !sp.totals.cacheWrite) {
    // A corrupt meta sidecar does not zero out cache-write — the transcript it
    // sits beside still books its tokens — but a freshly-dispatched agent with
    // no cache-creation turn flushed yet can still land here with `skipped=0`
    // and `metaErrors>0`: totals.cacheWrite is a sum across agents, so this
    // branch is reachable by metaErrors alone, not just by `skipped`.
    //
    // #916 reaches it by a shorter route, and it is the ticket's worst case:
    // when the damaged line WAS the run's only cache-creation turn there is
    // nothing left to sum, so cache-write is 0 with both other tallies 0 too.
    // Measured before `damaged` existed, that run rendered `hidden` — a
    // destroyed run shown as a run that had not started.
    const bits = [];
    if (sp.skipped) bits.push(`${sp.skipped} transcript${sp.skipped === 1 ? "" : "s"} skipped`);
    if (sp.damaged) bits.push(damagedPhrase(sp.damaged));
    if (sp.metaErrors) bits.push(metaErrorsPhrase(sp.metaErrors));
    return bits.length
      ? { kind: "note", text: `${bits.join("; ")}; no spend recorded yet` }
      : { kind: "hidden" };
  }
  return {
    kind: "panel",
    lede: `${k(sp.totals.cacheWrite)} cache-write · ${k(sp.totals.cacheRead)} cache-read · ${k(sp.totals.output)} output · ${sp.totals.agents} agents · review ${sp.reviewPct.toFixed(0)}%`,
    // `skipped` means "contributed nothing"; `damaged` means "contributed, but
    // may be missing the torn line's tool_use blocks and output_tokens
    // snapshot" (#916) — cache_creation/cache_read/maxCtx repeat on every line
    // of a turn and survive a mid-turn tear, so the panel's totals are not
    // necessarily short; `metaErrors` means "contributed,
    // in full, but under a degraded role and label" (#602) — classifyRole read
    // `{}` and gatherSpend fell back to the bare filename. Three different
    // lies, so three different phrases, all routed through the one channel that
    // already reaches the browser every tick. Listed in that order: most spend
    // lost first, so the one that most changes how to read the lede is read
    // first.
    note: [
      sp.skipped ? `${sp.skipped} transcript${sp.skipped === 1 ? "" : "s"} skipped` : null,
      sp.damaged ? damagedPhrase(sp.damaged, " — spend may be incomplete") : null,
      sp.metaErrors ? metaErrorsPhrase(sp.metaErrors, " — role/label degraded") : null,
      "ranked on cache-creation; tool split is attributed, not billed",
    ].filter(Boolean).join("; "),
    // These bars are percentages of the ATTRIBUTED subtotal, not of the headline
    // number: only a turn FOLLOWING a tool result can be charged to a tool, and an
    // agent's first turn — usually its single largest write — follows nothing. Say
    // what fraction is covered, so the two columns are not read as one base.
    // `!= null` rather than truthiness, so a genuine 0% still says so.
    toolHeading: sp.attributedPct != null
      ? `by tool — ${sp.attributedPct.toFixed(0)}% of cache-write attributed`
      : "by tool",
    roles: sp.roles || [],
    tools: (sp.tools || []).slice(0, 8),
  };
}

// Two views of one run: WHO spent it (role) and WHAT it went on (tool). The two
// percentage columns do NOT share a base — role pct is over total cache-write,
// tool pct is over the attributable subset only (turns following a tool result).
// Read each column against itself, never across.
function renderSpend(sp) {
  const host = document.getElementById("spend");
  host.innerHTML = "";
  const v = spendView(sp);
  if (v.kind === "hidden") return;
  if (v.kind !== "panel") { host.append(el("div", "spend-wrap", v.text)); return; }

  const wrap = el("div", "spend-wrap");
  const hd = el("div", "spend-hd");
  hd.append(el("h2", null, "spend"));
  hd.append(el("span", "lede", v.lede));
  hd.append(el("span", "note", v.note));
  wrap.append(hd);

  const cols = el("div", "spend-cols");
  const byRole = el("div");
  byRole.append(el("h3", null, "by role"));
  spendRows(byRole, v.roles, {
    label: (r) => `${r.role} ×${r.agents}`,
    value: (r) => k(r.cacheWrite),
    pct: (r) => r.pct,
    highlight: (r) => r.role === "reviewer" || r.role === "specialist",
  });
  const byTool = el("div");
  byTool.append(el("h3", null, v.toolHeading));
  spendRows(byTool, v.tools, {
    label: (t) => `${t.tool} ×${t.calls}`,
    value: (t) => k(t.cacheWrite),
    pct: (t) => t.pct,
  });
  cols.append(byRole, byTool);
  wrap.append(cols);
  host.append(wrap);
}

function render(m) {
  interval = m.interval || 15;
  repoUrl = m.repoUrl || null;
  // Every render, never once at startup: a board whose repo read fails on a
  // later tick goes BACK to the constant, and one whose repo arrives late
  // (the pre-first-tick stub carries none) picks it up on the tick after.
  // The emoji stays out of the tab title — a tab strip has no room for it,
  // and the document's own <title> is the constant this falls back to.
  const name = boardTitle(m.repo);
  document.title = name;
  document.getElementById("heading").textContent = "🛰 " + name;
  // attention strip
  const att = document.getElementById("attention");
  att.innerHTML = "";
  for (const t of m.attention || []) {
    const span = el("span", "att");
    span.append(el("span", "n", "#" + t.issue), document.createTextNode(" "));
    span.append(el("span", "flag", (t.flags || []).join(" ")));
    att.append(span);
  }
  // columns — each built once and kept, its contents rewritten every tick
  // (#1848). A column scrolls on its own (#1759) and a scroll offset lives on
  // the element, so a tick that threw the columns away and built new ones
  // jumped every column back to the top within one poll. Keeping the node
  // keeps its scroll — and a scroll still in flight — with nothing to save
  // or restore.
  const board = document.getElementById("board");
  for (const name of COLUMNS) {
    let col = colNodes.get(name);
    if (!col) { col = el("div", "col"); colNodes.set(name, col); board.append(col); }
    const inCol = (m.tickets || []).filter((t) => t.column === name);
    const h = el("h2", null, name + " ");
    h.append(el("span", null, String(inCol.length)));
    col.replaceChildren(h, ...inCol.map(card));
  }
  renderSpend(m.spend);
  // footer
  const q = m.queue || {};
  const foot = document.getElementById("footer");
  foot.innerHTML = "";
  foot.append(el("div", null, `pool ${q.pool ?? 0} · supply ${q.supply ?? 0} · review-backlog ${q.reviewBacklog ?? 0}`));
  const filed = el("div", "filed", `filed follow-ups (${(m.filed || []).length}): ` +
    (m.filed || []).map((f) => "#" + f.issue).join(" "));
  foot.append(filed);
  // freshness
  // #1713: exactly one payload reaches this page without a `generatedAt` —
  // #1660's identity stub, written at bind time so a racing launch's probe has
  // something to read. The page can now SEE it, because the cockpit answers
  // HTTP while its first tick is still computing where it used to answer
  // nothing at all until the tick was done. Only computeBoard() sets the
  // field, so its absence means "no board built yet", not "a board of unknown
  // age" — and `mins(undefined)` is NaN, which rendered as "updated NaNm ago".
  const built = typeof m.generatedAt === "number";
  document.getElementById("age").textContent = built ? "updated " + mins(m.generatedAt) + "m ago" : "building…";
  const banner = document.getElementById("stale-banner");
  const ledgerMsg = ledgerBanner(m.ledgerState);
  const stallMsg = livenessBanner(m.liveness);
  // className reset on EVERY arm, never only on the arm that sets it: this
  // element is reused across ticks, so a `dead` class left behind by an
  // earlier render paints the next tick's ledger or stale message red. One
  // assignment per arm is what makes that unreachable rather than unlikely.
  if (built && Date.now() - m.generatedAt > interval * 1000 * 2) {
    banner.style.display = "block";
    banner.className = "";
    banner.textContent = "⚠ data stale — server/controller stopped?";
  } else if (stallMsg) {
    banner.style.display = "block";
    banner.className = "dead";
    banner.textContent = stallMsg;
  } else if (ledgerMsg) {
    banner.style.display = "block";
    banner.className = "";
    banner.textContent = ledgerMsg;
  } else { banner.style.display = "none"; banner.className = ""; }
}

// The heartbeat's mark, rendered — #1597. A dead run's tickets keep the label
// that marks them in flight, and the candidate scan EXCLUDES that label, so a
// run that stopped silently costs the night AND strands its tickets out of
// sight of the next run's scans. This is the surface that says so while the
// cockpit is still up; fleet-tick's start says it when nothing survived.
//
// The words are NOT composed here. `text` is computed by compute-board.mjs
// through fleet-state.mjs's stallReport(), the same function fleet-tick
// prints, so the two surfaces cannot describe one dead run differently. This
// function owns exactly one decision — whether there is a banner at all —
// and a payload with no `text` yields no banner rather than an empty one.
// The `l` check alone already covers a board.json written before this field
// existed (`liveness` is simply absent there, `undefined`, caught by `l &&`)
// — what the SECOND guard defends against is a hand-edited or partially
// written board.json carrying a truthy `liveness` object with no `text` of
// its own: `⚠ undefined` is worse than no banner at all.
//
// Ranked BELOW "data stale" at the call site above, deliberately. A board
// that stopped updating cannot be trusted to say anything current about the
// beat — its liveness field is as old as the rest of it — and announcing a
// death off a frozen page is the cry-wolf direction. Above the ledger
// messages, which report a degraded read of one input; this reports that
// nobody is working the board at all.
function livenessBanner(l) {
  return l && l.text ? "⚠ " + l.text : null;
}

// Three ledger states, three renderings (#816). `read` refuses an absent ledger
// under --require-file now, so gather() can tell "there was no ledger to read"
// from "read it, nothing filed yet" from "read it, the answer would not parse".
// All three used to arrive here as the same empty lists and drew the same empty
// board, which reads as a quiet run rather than a broken one.
//
// A ledger read empty gets no banner at all: it is the ordinary state of a run
// that has just started, and a warning there would fire on every first tick and
// train the operator to ignore this strip. Stale outranks both messages at the
// call site above — it says the whole board is old, not that one read failed.
function ledgerBanner(state) {
  if (state === "unread") return "⚠ ledger not read — no ledger file, or it could not be read (see --ledger / stderr)";
  if (state === "unparsed") return "⚠ ledger read did not parse — this board is incomplete";
  return null;
}

function card(t) {
  const c = el("div", "card");
  const top = el("div", "top");
  top.append(el("span", "n", "#" + t.issue));
  top.append(el("span", "title", t.title || ""));
  c.append(top);
  const meta = el("div", "meta");
  if (t.agent) meta.append(el("span", null, t.agent));
  if (t.pr != null) {
    const a = el("a", null, "PR#" + t.pr);
    a.href = repoUrl ? repoUrl + "/pull/" + t.pr : "#";
    a.target = "_blank"; a.rel = "noopener";
    meta.append(a);
  }
  if (t.ci) { const d = el("span", "dot " + t.ci); meta.append(d); }
  if (t.sinceEnteredStage) meta.append(el("span", null, mins(t.sinceEnteredStage) + "m"));
  for (const f of t.flags || []) meta.append(el("span", "badge flag", f));
  if (t.ruling) meta.append(el("span", "badge", "ruled:" + t.ruling));
  c.append(meta);
  return c;
}

function warn(msg) {
  const banner = document.getElementById("stale-banner");
  banner.style.display = "block";
  banner.textContent = msg;
}

async function poll() {
  let r;
  try {
    r = await fetch("/board.json", { cache: "no-store" });
  } catch (e) {
    warn("⚠ cockpit server not running");     // transport failure only — server unreachable
    setTimeout(poll, interval * 1000);
    return;
  }
  if (!r.ok) {
    warn("⚠ board.json HTTP " + r.status);      // server up, but no readable board yet (e.g. first tick failed)
  } else {
    // Parse + render sit OUTSIDE the transport try: a corrupt payload or a
    // render bug is NOT a dead server, and must not be mislabelled as one.
    try { render(await r.json()); }
    catch (e) { warn("⚠ board render failed: " + e.message); }
  }
  setTimeout(poll, interval * 1000);
}
poll();
</script>
</body>
</html>
