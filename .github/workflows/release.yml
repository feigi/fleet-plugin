name: Release

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Determine bump segment
        id: segment
        env:
          # Snapshot label from the merge-time event payload (not a live
          # gh query) so post-merge label edits cannot change the bump.
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels) }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          SEGMENT=""
          if ! SEGMENT=$(echo "$LABELS_JSON" | jq -r '[.[].name | select(. == "patch" or . == "minor" or . == "major")][0] // ""'); then
            echo "::error::failed to parse labels from event payload"
            exit 1
          fi
          if [ -z "$SEGMENT" ] || [ "$SEGMENT" = "null" ]; then
            echo "::error::merged PR #$PR has no release label. The required 'validate-release-label' check should have made that unreachable (ADR 0007), so suspect the gate before the PR — run '.github/scripts/apply-ruleset.sh --check' to see whether main's live ruleset still names that context (exit 3 means it does not)."
            exit 1
          fi
          echo "segment=$SEGMENT" >> "$GITHUB_OUTPUT"

      - name: Compute next version
        id: version
        env:
          SEGMENT: ${{ steps.segment.outputs.segment }}
        run: |
          set -euo pipefail
          # --force overwrites local tags that diverged from remote.
          # Safe on a fresh CI checkout; would be destructive locally.
          git fetch --tags --force

          # Detect "tags exist" independently of the regex used to pick
          # LATEST, so a regex drift cannot silently re-seed the repo.
          TAG_COUNT=$(git tag --list 'v*' | wc -l | tr -d ' ')
          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | sort -V \
            | tail -1)

          if [ -z "$LATEST" ] && [ "$TAG_COUNT" -gt 0 ]; then
            echo "::error::v* tags exist but none matched semver regex — refusing to seed."
            git tag --list 'v*'
            exit 1
          fi

          if [ -z "$LATEST" ]; then
            # #1314/#1294's hand-off: "Seed v0.1.1 on main BEFORE the first
            # release, so numbering continues PAST the 0.1.1 already sitting
            # in both harnesses' caches" — v0.1.1 is a pre-existing tag the
            # operator mints out of band (see this PR's description for the
            # exact command), never a value this workflow computes. Reverting
            # to agent-brain's own zero-tags scheme, unchanged: the FIRST
            # release this workflow ever mints is v1.0.0/v0.1.0/v0.0.1 by
            # segment, UNLESS the v0.1.1 seed tag already exists — and once
            # it does, LATEST is non-empty and this whole branch is
            # unreachable, so seeding it is what actually makes the first
            # MINTED release v0.1.2, not equal to the installed 0.1.1.
            case "$SEGMENT" in
              major) NEXT="v1.0.0" ;;
              minor) NEXT="v0.1.0" ;;
              patch) NEXT="v0.0.1" ;;
              *) echo "::error::invalid segment '$SEGMENT'"; exit 1 ;;
            esac
            echo "Seeding first release as $NEXT (segment=$SEGMENT)."
          else
            VERSION="${LATEST#v}"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::malformed latest tag '$LATEST'"
              exit 1
            fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            case "$SEGMENT" in
              major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR+1)); PATCH=0 ;;
              patch) PATCH=$((PATCH+1)) ;;
              *) echo "::error::invalid segment '$SEGMENT'"; exit 1 ;;
            esac
            NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next version: $NEXT"

      - name: Create tag (idempotent)
        env:
          NEXT: ${{ steps.version.outputs.next }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --tags --exit-code origin "refs/tags/$NEXT" >/dev/null 2>&1; then
            echo "Tag $NEXT already exists on remote — skipping tag creation."
          else
            git tag -a "$NEXT" "$SHA" -m "Release $NEXT"
            git push origin "$NEXT"
          fi

      - name: Create GitHub release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.version.outputs.next }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          # gh defaults to api.github.com; derive the host from the runner's
          # server URL so it targets the right API on both github.com and GHE.
          export GH_HOST="${GITHUB_SERVER_URL#https://}"
          if gh release view "$NEXT" >/dev/null 2>&1; then
            echo "Release $NEXT already exists — skipping."
          else
            gh release create "$NEXT" --target "$SHA" --generate-notes --title "$NEXT"
          fi

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export GH_HOST="${GITHUB_SERVER_URL#https://}"
          gh pr comment "$PR" --body "Release workflow failed: $RUN_URL"
