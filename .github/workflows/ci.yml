name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Most checks in the `check` job run a checker over `git ls-files '<glob>'`;
# without pipefail a broken left-hand side is a green run that checked nothing.
# A left-hand side that SUCCEEDS with an empty match is the other half of the
# same hole, and pipefail cannot see that one at all — which is what
# .github/scripts/check-tracked.sh is for (#161). (The Tests step and
# rebase-check's script are not that shape — both set their own options.)
defaults:
  run:
    shell: bash

jobs:
  # Currency is enforced TWICE over, deliberately. The `main` ruleset carries
  # `strict_required_status_checks_policy` (ADR 0007), which refuses the merge
  # button outright while a branch is behind — that is the gate, and it cannot
  # go stale the way a check result can. This job stays required for the half a
  # ruleset cannot express, the no-merge-commits assertion below, and for the
  # actionable `git rebase origin/main` line a bare merge-button refusal does
  # not print. This job's name is no longer load-bearing for any *workflow*
  # — `rebase-check-refresh.yml` and `rerun-rebase-check.sh` re-ran this job
  # by a `select(.name == "rebase-check")` lookup and were deleted with
  # #164, because the stale green they existed to flip can no longer reach a
  # merge — but that is not the same as unconstrained: mechanisms that only
  # look like a workflow still read it:
  #   - the `main` ruleset requires a status-check context spelled
  #     `rebase-check` (`.github/rulesets/main.json` is the checked-in spec; ADR
  #     0007 records the same requirement). A required context is matched against
  #     the name the API reports for the job — the same string the deleted
  #     `select(.name == "rebase-check")` lookup keyed on.
  #   - `plugin/scripts/ci-state.mjs`'s `expectedJobs()` derives the set of jobs
  #     a run must contain from the `jobs:` block of the CI workflow it resolves
  #     — this file, in this repo — taking each job's YAML KEY, then looks for
  #     those strings among the job names the API reports.
  # A YAML key and an API-reported display name are different things holding the
  # same string, and they coincide only while every job's reported name is its
  # own key: unset by an explicit `name:`, and also unset by a `strategy.matrix`
  # block, which GitHub appends matrix values to the reported name even when no
  # `name:` is set. Adding either — here, or on any job, however tempting as a
  # way to make a load-bearing name explicit — breaks both readers, in opposite
  # registers. `expectedJobs()` only guards the canonical `    name:` spelling
  # (unquoted key, no space before the colon): that spelling makes it refuse to
  # derive at all rather than compare strings it can no longer trust — loud,
  # and no PR gets a CI-state answer until the `name:` is removed. A
  # `strategy.matrix` block, or `name:` spelled `name :` or `"name":`, is
  # YAML-legal, sets the same job-level name, and slips past that guard
  # silently. The ruleset fails quieter and worse regardless of spelling — the
  # job publishes its context under the new name, so nothing called
  # `rebase-check` reports, and a required context that never arrives strands
  # the PR instead of failing it: the same hazard ADR 0007's
  # `required_status_checks` row kept `auto-label-bots` out of the required set
  # for. The other half of this note sits at the `sawNameOverride` refusal in
  # ci-state.mjs.
  rebase-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify branch is rebased on base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if ! git fetch --no-tags --prune origin "$BASE_REF"; then
            echo "::error::Failed to fetch origin/$BASE_REF — base branch may have been deleted or renamed"
            exit 1
          fi
          if ! BASE_SHA=$(git rev-parse "origin/$BASE_REF" 2>&1); then
            echo "::error::Could not resolve origin/$BASE_REF: $BASE_SHA"
            exit 1
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          if ! MERGE_BASE=$(git merge-base HEAD "$BASE_SHA" 2>&1); then
            echo "::error::No common ancestor with origin/$BASE_REF: $MERGE_BASE"
            exit 1
          fi
          if [ "$MERGE_BASE" != "$BASE_SHA" ]; then
            echo "::error::Branch is not rebased on origin/$BASE_REF (head=$HEAD_SHA base=$BASE_SHA merge-base=$MERGE_BASE). Run: git fetch origin && git rebase origin/$BASE_REF"
            exit 1
          fi
          MERGE_COMMITS=$(git rev-list --merges --count "$BASE_SHA..HEAD")
          if [ "$MERGE_COMMITS" != "0" ]; then
            echo "::error::Branch contains $MERGE_COMMITS merge commit(s) above origin/$BASE_REF (head=$HEAD_SHA). Rebase to keep linear history: git fetch origin && git rebase origin/$BASE_REF"
            exit 1
          fi
          echo "Branch rebased on origin/$BASE_REF ($BASE_SHA), no merge commits."

  check:
    runs-on: ubuntu-latest
    # The suite spawns git/python3 subprocesses per test and one case builds a
    # `git archive` snapshot (~25s locally); cap the run so a wedged subprocess
    # can't hold a runner open indefinitely.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # .nvmrc is the single source of truth for the target runtime — the one
      # the suite is developed and run against. It holds an EXACT version, and
      # Renovate moves it on a monthly schedule rather than a human noticing:
      # see ADR 0010 for why the exact pin stayed and why a partial spec (`26`)
      # was measured and rejected. That schedule's window bounds when the bot
      # opens its PR, not when the PR merges: the merge waits on the required
      # checks, whenever they finish — and a major bump is not automerged, so
      # its merge waits on a human too. Do not hand-edit this to float.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # There is no build: this repo ships .mjs and .sh straight to the runtime.
      # `node --check` is the whole of it — the only thing that catches a syntax
      # error in a script no test imports before a hook runs it for real.
      - name: Syntax-check scripts
        run: .github/scripts/check-tracked.sh '*.mjs' -n1 node --check

      # Parses every file `git ls-files '*.json'` lists — whatever the tree
      # tracks on the day, so a JSON file committed later is covered with no
      # edit here. No count and no list of them, on purpose: the count this
      # comment used to carry went stale as files were added (#1903), and
      # ci-comment-rot-prose.test.mjs refuses one coming back. The runtime
      # caches are NOT covered and cannot be — every one of them is
      # gitignored, so `git ls-files` never sees them. Do not read this step
      # as saying anything about a cache.
      # `jq empty`, not `jq -e .`: `-e` takes its status from the last OUTPUT
      # value, so it exits 1 on a file holding `null` or `false` — both valid
      # JSON — and a step named "Validate JSON" then fails saying nothing.
      - name: Validate JSON
        run: .github/scripts/check-tracked.sh '*.json' -n1 jq empty

      # The allow-list checker (#1314, #1347). frontmatter-check.mjs enforces
      # frontmatter-allowlist.json's three key sets (agents, skills, commands)
      # in BOTH directions — unknown keys rejected, required keys enforced —
      # plus a forbidden class for keys that ARE documented but
      # silently reroute a member's tier, tree, or dispatch. One
      # check-tracked.sh call per kind: each glob's own non-vacuity refusal
      # covers the day one of the three directories goes missing entirely,
      # the same discipline every other step here already uses.
      # Three separate single-line `run:` steps, not one `run: |` block — so
      # each one is its own routed `check-tracked.sh` invocation
      # `ci-vacuous-green.test.mjs`'s "a routed check's own exit status
      # still reaches the job" can see and pin against its own no-swallow
      # regex (a multi-line block hides every invocation inside it from a
      # line-anchored `run:` collector).
      - name: Allow-list check — agents
        run: .github/scripts/check-tracked.sh 'plugin/agents/*.md' node plugin/scripts/frontmatter-check.mjs
      - name: Allow-list check — skills
        run: .github/scripts/check-tracked.sh 'plugin/skills/*/SKILL.md' node plugin/scripts/frontmatter-check.mjs
      - name: Allow-list check — commands
        run: .github/scripts/check-tracked.sh 'plugin/commands/*.md' node plugin/scripts/frontmatter-check.mjs

      # #2207: every tier-outcomes.tsv row dated from the tier switch on must
      # name the definition its ticket's implementer actually ran under, per
      # the committed member-outcomes.tsv. No `--live`: the run ledger's
      # missing-row warning belongs to a run in progress, and CI has no run.
      - name: Tier-outcomes check
        run: node plugin/scripts/tier-outcomes.mjs check --file docs/metrics/tier-outcomes.tsv --member-outcomes docs/metrics/member-outcomes.tsv

      # -S warning, not the default: the default adds info-level hits that are
      # noise here — SC2016 where a single-quoted `python3 -c` script is meant
      # not to expand, SC1003 on an OSC-8 escape, SC2015 on the
      # `a=$(…) && b=$(…) || die` chains where `die` is the branch every
      # failure in the chain should take. Shapes, not a closed list, and
      # deliberately no file names: a file list goes stale the next time one of
      # them is edited, and shellcheck is how you find the sites anyway.
      # Re-measure before acting on this. Raise this to `style` only after
      # silencing them at the source.
      - name: Shellcheck
        run: .github/scripts/check-tracked.sh '*.sh' shellcheck -x -S warning

      # Validate JSON above only parses renovate.json: `jq empty` passes a
      # well-formed file whose timezone does not exist (#1854). Renovate's own
      # validator is what checks the options — unknown ones, global-only ones,
      # bad schedules, and with `--strict` a config that needs migrating.
      # A step in `check`, which the `main` ruleset already requires, and on
      # every PR: a `paths:`-filtered job skips on most PRs, and ADR 0007 keeps
      # any check that can skip out of the required set.
      # The file is named rather than discovered: with no argument the
      # validator exits 0 on a tree holding no config at all, so a deleted
      # renovate.json, or one moved to a name Renovate does not read, would go
      # green having validated nothing. Named, a missing file is exit 1 — so
      # moving it to another name Renovate does read means editing this line
      # with it. `--no-global` because a named file is
      # otherwise read as self-hosted GLOBAL config, which accepts options a
      # repository config may not carry.
      # Not a full schema check: it does not, in general, hold a string option
      # to its declared allowed values — an invalid `internalChecksFilter`
      # passes.
      # Pinned, not `@latest`: a floating validator would change what this
      # step accepts with no commit here saying so. An option newer than the
      # pin is refused as unknown even where the hosted app accepts it — bump
      # the pin with the config. npm's EBADENGINE warning is expected: this
      # runs on the .nvmrc Node, outside the range Renovate declares.
      - name: Validate renovate.json
        run: npx --yes -p renovate@44.115.7 renovate-config-validator --strict --no-global renovate.json

      # gh applies `--jq` with its own embedded gojq (RE2), not the system jq
      # the candidates stub execs, so candidates.test.mjs gates its engine-parity
      # tests on a real gojq binary being resolvable — and a gate that does not
      # resolve one SKIPS, which is green. Without this the only executable
      # checks that the `--jq` programs hold under the production engine never
      # ran here (#337).
      # Provisioned after the checkers above rather than beside setup-node: a
      # shellcheck or syntax failure then fails the job without paying for the
      # toolchain.
      # `cache: false` because setup-go's cache keys off a go.sum, and this repo
      # has no Go module — there is nothing to key on.
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      # Pinned rather than `@latest`: a gojq release would otherwise change what
      # the engine gate MEANS without any commit here, which is the same silent
      # drift the pin on the node version above exists to stop.
      - name: Install gojq
        env:
          GOBIN: ${{ runner.temp }}/gojq
        run: go install github.com/itchyny/gojq/cmd/gojq@v0.12.19

      # Explicit glob, not the directory, to pin exactly which files run.
      # NOT because node would otherwise walk into a vendored tree: node's own
      # discovery excludes `node_modules` (measured), and the defect behind
      # 'the runner's directory expansion ran vendored tests' was a `find` in
      # the runner — see agent-test, which says so itself: "this
      # walk, not node, is what keeps vendored tests out". There is no
      # vendored tree under plugin/scripts/ anyway.
      # The suite stubs `gh` and sets its own git identity, so it needs no auth
      # and no network.
      # `failglob` because the bare glob is exactly the silent green this repo
      # already documents in review-and-fix.md — unmatched, bash passes the
      # pattern through literally, node globs it itself, finds nothing, and
      # exits 0 having run not one test. No node flag fails a zero-test run,
      # so the shell has to be the guard.
      - name: Tests
        env:
          # Naming the binary, rather than leaving findGojq() to probe PATH and
          # $(go env GOPATH)/bin, is what makes a failed provision LOUD: that
          # function hard-fails on a GOJQ_BIN that is not gojq, so a step that
          # silently produced nothing reds the job instead of handing the engine
          # gates back their skip.
          GOJQ_BIN: ${{ runner.temp }}/gojq/gojq
        run: |
          shopt -s failglob
          node --test plugin/scripts/*.test.mjs

  # #1314's ruling, #1293's findings on what "loaded" can mean headlessly,
  # ADR 0021's native route: links this checkout with `omp plugin link` and
  # asserts commands via substitution (bare names), agents and skills by
  # presence, and one real dispatch of `fleet-finisher` whose child session
  # record must show the declared @smol:low tier — the #1430 regression
  # gate. The parent turn runs against a scripted local mock (no API key in
  # CI, no outbound provider request anywhere in the job). See
  # .github/scripts/smoke-omp.sh's header for the full reasoning.
  smoke-omp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # A real local branch, not detached HEAD — the fleet's own gh and
          # git callsites assume a named ref (ADR 0003's checkout shape is
          # unchanged by ADR 0021; the link route itself takes a path).
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      # Pinned via the exact package `omp` resolves to on this box
      # (`@oh-my-pi/pi-coding-agent`), not `omp`/`omp.sh` — measured: neither
      # of those npm names is this package (#1319's own collision class).
      - name: Install pinned omp
        run: bun install -g @oh-my-pi/pi-coding-agent@18.4.4

      - name: smoke-omp
        run: .github/scripts/smoke-omp.sh

  # #1294 hand-off §2, #1339, #1347 — REWORKED per PR #1365's review from an
  # earlier design that ran the whole test suite from an installed copy
  # (cannot pass: a git-subdir install carries `plugin/` alone, and ~30 test
  # files read repo-root paths a plugin-only payload never has). The actual
  # ruling (#1294): source unit tests plus ONE install-and-smoke job proving
  # the Install-root/target-repo invariant is exercised — installs on omp,
  # runs `fleet-provenance`, resolves every `fleet-run <script>` prose
  # callsite, execs `fleet-run arg.mjs` once. No test suite runs from an
  # install. See
  # .github/scripts/install-and-smoke.sh's own header for the full
  # reasoning and the measured 70/1964-failure reproduction that forced
  # this rewrite.
  install-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      # Exact pin Renovate moves: see ADR 0010. Do not hand-edit this to float.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install pinned omp
        run: bun install -g @oh-my-pi/pi-coding-agent@18.4.4

      - name: install-and-smoke
        run: .github/scripts/install-and-smoke.sh
