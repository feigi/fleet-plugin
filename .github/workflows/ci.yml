name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Most checks in the `check` job run a checker over `git ls-files '<glob>'`;
# without pipefail a broken left-hand side is a green run that checked nothing.
# A left-hand side that SUCCEEDS with an empty match is the other half of the
# same hole, and pipefail cannot see that one at all — which is what
# .github/scripts/check-tracked.sh is for (#161). (The Tests step and
# rebase-check's script are not that shape — both set their own options.)
defaults:
  run:
    shell: bash

jobs:
  # NOTE: this job's name is load-bearing. `rebase-check-refresh.yml` re-runs it
  # when main advances, and the `rerun-rebase-check.sh` script it invokes locates
  # the job by its `select(.name == "rebase-check")` lookup. Adding a
  # `name:` key here (or renaming the job) makes that workflow match nothing —
  # loudly, not silently: every behind PR counts as no-job and its
  # `BEHIND>0 && RERAN==0` guard exits 1. Red with a per-PR reason, not a
  # green that refreshed nothing.
  rebase-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify branch is rebased on base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if ! git fetch --no-tags --prune origin "$BASE_REF"; then
            echo "::error::Failed to fetch origin/$BASE_REF — base branch may have been deleted or renamed"
            exit 1
          fi
          if ! BASE_SHA=$(git rev-parse "origin/$BASE_REF" 2>&1); then
            echo "::error::Could not resolve origin/$BASE_REF: $BASE_SHA"
            exit 1
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          if ! MERGE_BASE=$(git merge-base HEAD "$BASE_SHA" 2>&1); then
            echo "::error::No common ancestor with origin/$BASE_REF: $MERGE_BASE"
            exit 1
          fi
          if [ "$MERGE_BASE" != "$BASE_SHA" ]; then
            echo "::error::Branch is not rebased on origin/$BASE_REF (head=$HEAD_SHA base=$BASE_SHA merge-base=$MERGE_BASE). Run: git fetch origin && git rebase origin/$BASE_REF"
            exit 1
          fi
          MERGE_COMMITS=$(git rev-list --merges --count "$BASE_SHA..HEAD")
          if [ "$MERGE_COMMITS" != "0" ]; then
            echo "::error::Branch contains $MERGE_COMMITS merge commit(s) above origin/$BASE_REF (head=$HEAD_SHA). Rebase to keep linear history: git fetch origin && git rebase origin/$BASE_REF"
            exit 1
          fi
          echo "Branch rebased on origin/$BASE_REF ($BASE_SHA), no merge commits."

  check:
    runs-on: ubuntu-latest
    # The suite spawns git/python3 subprocesses per test and one case builds a
    # `git archive` snapshot (~25s locally); cap the run so a wedged subprocess
    # can't hold a runner open indefinitely.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      # .nvmrc is the single source of truth for the target runtime — the one
      # the suite is developed and run against — so a version bump is a
      # one-file edit instead of a literal drifting out of sync here.
      #
      # This commit itself moves CI from the latest 22.x LTS (what the old
      # `node-version: 22` pin floated to on every run) to 26.5.0, the version
      # the suite is developed against. Tradeoff: patch pickup is no longer
      # automatic — an exact .nvmrc pin doesn't float the way `node-version: 22`
      # did, so a patch bump (e.g. picking up a security release) is now a
      # deliberate one-file edit here.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # There is no build: this repo ships .mjs and .sh straight to the runtime.
      # `node --check` is the whole of it — the only thing that catches a syntax
      # error in a script no test imports before a hook runs it for real.
      - name: Syntax-check scripts
        run: .github/scripts/check-tracked.sh '*.mjs' -n1 node --check

      # The two tracked `.js` files need DIFFERENT invocations, not a wider glob:
      #   - an ordinary CommonJS script, which `node --check` accepts as-is.
      #     hooks/statusline.js was the only one and left with the 2026-09-08
      #     config split, so today the `*)` branch matches nothing — it stays
      #     for the next plain .js this repo grows.
      #   - workflows/*.js (review-pr.js) is a Workflow-harness script: the
      #     harness reads `export const meta = …` off it without running it,
      #     then wraps the REST of the file's body in an async function it
      #     executes — so the file also has top-level `await`/`return`, legal
      #     only inside that wrapper. That combination parses as neither a
      #     module (top-level `return` is always illegal in ESM) nor a plain
      #     CJS script (the `export`) — `node --check` rejects it either way.
      #     `new AsyncFunction(...)` is the one thing that compiles both parts
      #     without running them; it's also what
      #     scripts/review-pr-reads.test.mjs's "review-pr.js parses
      #     — no other reader in this repo would notice a syntax error" already
      #     uses to catch exactly this, reused here rather than reinvented.
      #     Cited by test NAME, not by line: a refactor that shifts that file
      #     silently re-points a line number at unrelated code, and this
      #     particular argument isn't pinned by any test — scripts/
      #     ci-comment-rot-prose.test.mjs checks several other claims in this
      #     file, but not this one.
      #     That test pins review-pr.js BY NAME, so for that one file this loop
      #     is redundant today. The loop is here so workflows/merge-wave.js
      #     (docs/specs/2026-07-23-fleet-plugin-design.md, section `## Layout`:
      #     the `~/.claude/workflows/` tree lists `merge-wave.js` as `(stage 2)`)
      #     and successors are covered on arrival without a CI edit.
      #     Exactly ONE top-level `export` is the contract (`meta`, first thing
      #     in the file), which is why the strip below is `/m` and not `/gm`: a
      #     second top-level export is a file the harness rejects, and `/gm`
      #     would green it.
      #   Naively widening the old glob to `*.js` turns this red: node --check
      #   parses workflows/*.js as CJS and dies on its first `export`.
      #   Next person to touch this glob: this is why it isn't `*.js`.
      - name: Syntax-check .js scripts
        run: |
          set -euo pipefail
          # Same vacuous green as the check-tracked.sh steps, different shape: a
          # `for` over an empty list iterates zero times and exits 0. The
          # per-file dispatch below is what keeps this step off that script, so
          # it carries the count and the refusal itself.
          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done < <(git ls-files -z -- '*.js')
          echo "checking ${#files[@]} file(s) matching *.js"
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no tracked file matches *.js — this check verified nothing"
            exit 1
          fi
          for f in "${files[@]}"; do
            case "$f" in
              workflows/*)
                node -e '
                  const fs = require("fs");
                  const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;
                  const src = fs.readFileSync(process.argv[1], "utf8");
                  new AsyncFunction(
                    "args", "budget", "agent", "parallel", "pipeline", "phase", "log", "workflow",
                    src.replace(/^export /m, ""),
                  );
                ' "$f"
                ;;
              *)
                node --check "$f"
                ;;
            esac
          done

      # Exactly two tracked JSON files, both plugin manifests:
      # .claude-plugin/plugin.json and .claude-plugin/marketplace.json.
      # `settings.json` used to be the first of them and left with the
      # 2026-09-08 config split. The runtime caches are NOT covered and cannot
      # be — every one of them is gitignored, so `git ls-files` never sees
      # them. Do not read this step as saying anything about a cache.
      # `jq empty`, not `jq -e .`: `-e` takes its status from the last OUTPUT
      # value, so it exits 1 on a file holding `null` or `false` — both valid
      # JSON — and a step named "Validate JSON" then fails saying nothing.
      - name: Validate JSON
        run: .github/scripts/check-tracked.sh '*.json' -n1 jq empty

      # -S warning, not the default: the default adds info-level hits that are
      # noise here — SC2016 where a single-quoted `python3 -c` script is meant
      # not to expand, SC1003 on an OSC-8 escape, SC2015 on the
      # `a=$(…) && b=$(…) || die` chains where `die` is the branch every
      # failure in the chain should take. Shapes, not a closed list, and
      # deliberately no file names: a file list goes stale the next time one of
      # them is edited, and shellcheck is how you find the sites anyway.
      # Re-measure before acting on this. Raise this to `style` only after
      # silencing them at the source.
      - name: Shellcheck
        run: .github/scripts/check-tracked.sh '*.sh' shellcheck -x -S warning

      # gh applies `--jq` with its own embedded gojq (RE2), not the system jq
      # the candidates stub execs, so candidates.test.mjs gates its engine-parity
      # tests on a real gojq binary being resolvable — and a gate that does not
      # resolve one SKIPS, which is green. Without this the only executable
      # checks that the `--jq` programs hold under the production engine never
      # ran here (#337).
      # Provisioned after the checkers above rather than beside setup-node: a
      # shellcheck or syntax failure then fails the job without paying for the
      # toolchain.
      # `cache: false` because setup-go's cache keys off a go.sum, and this repo
      # has no Go module — there is nothing to key on.
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      # Pinned rather than `@latest`: a gojq release would otherwise change what
      # the engine gate MEANS without any commit here, which is the same silent
      # drift the pin on the node version above exists to stop.
      - name: Install gojq
        env:
          GOBIN: ${{ runner.temp }}/gojq
        run: go install github.com/itchyny/gojq/cmd/gojq@v0.12.19

      # Explicit glob, not the directory, to pin exactly which files run.
      # NOT because node would otherwise walk into a vendored tree: node's own
      # discovery excludes `node_modules` (measured), and the defect behind
      # 'the runner's directory expansion ran vendored tests' was a `find` in
      # the emitted runner — see claim-ticket.sh, which says so itself: "this
      # walk, not node, is what keeps vendored tests out". There is no
      # vendored tree under scripts/ anyway.
      # The suite stubs `gh` and sets its own git identity, so it needs no auth
      # and no network.
      # `failglob` because the bare glob is exactly the silent green this repo
      # already documents in review-and-fix.md — unmatched, bash passes the
      # pattern through literally, node globs it itself, finds nothing, and
      # exits 0 having run not one test. No node flag fails a zero-test run,
      # so the shell has to be the guard.
      - name: Tests
        env:
          # Naming the binary, rather than leaving findGojq() to probe PATH and
          # $(go env GOPATH)/bin, is what makes a failed provision LOUD: that
          # function hard-fails on a GOJQ_BIN that is not gojq, so a step that
          # silently produced nothing reds the job instead of handing the engine
          # gates back their skip.
          GOJQ_BIN: ${{ runner.temp }}/gojq/gojq
        run: |
          shopt -s failglob
          node --test scripts/*.test.mjs
