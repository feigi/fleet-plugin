<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fleet cockpit</title>
<style>
  :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --line:#30363d;
    --fg:#e6edf3; --dim:#8b949e; --red:#f85149; --amber:#d29922; --green:#3fb950; --blue:#58a6ff; }
  * { box-sizing: border-box; }
  /* The page is the window's height: header, banner, attention strip, the tab
     strip and footer keep their natural height and never shrink; the open
     tab's pane (#board, #cells or #spend, the others are hidden) takes the rest, and
     each board column scrolls on its own past that. The panes' min-height is
     the floor for a window too short for the fixed parts — they then overflow
     body and the PAGE scrolls, rather than squeezing the columns to nothing or
     clipping anything off. */
  body { margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
    height:100vh; display:flex; flex-direction:column; }
  /* Belt-and-braces: a flex item's own min-height:auto already stops it
     shrinking below its content, so nothing here strictly needs flex:none to
     hold its height — #board's own min-height:200px is what actually floors
     the layout. Costs nothing to keep, and guards against a future rule on
     any of these six children that would otherwise let it shrink. */
  body > * { flex:none; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  #age { color:var(--dim); font-size:12px; margin-left:auto; }
  #stale-banner { display:none; background:var(--amber); color:#000; padding:6px 16px; font-weight:600; }
  /* A stopped RUN, not stale data: red, because the fleet is not working and
     its claimed tickets are stranded behind a label the next run's scan skips. */
  #stale-banner.dead { background:var(--red); color:#fff; }
  #attention { padding:8px 16px; border-bottom:1px solid var(--line); background:#2d1618; }
  #attention:empty { display:none; }
  .att { display:inline-block; margin:2px 10px 2px 0; color:inherit; text-decoration:none; }
  .att:hover { text-decoration:underline; }
  .att .n { color:var(--blue); font-weight:600; }
  .flag { color:var(--red); font-weight:600; }
  #board { display:grid; grid-template-columns:repeat(5,1fr); grid-template-rows:minmax(0,1fr); gap:10px; padding:14px; align-items:start;
    flex:1 1 0; min-height:200px; }
  /* As tall as its content, capped at the board's height, then it scrolls. */
  .col { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px; min-height:80px;
    max-height:100%; overflow-y:auto; }
  /* Pinned while the cards scroll beneath. The negative margins stretch its
     opaque background to the column's padding edge so no card shows around
     it; the padding puts the text back exactly where the old margin had it.
     top is -8px, not 0, because Chromium measures a sticky offset from the
     scroller's padding edge — 0 would park it 8px down, cards showing above. */
  .col h2 { font-size:11px; letter-spacing:.06em; color:var(--dim); margin:-8px -8px 0; padding:10px 12px 8px; text-transform:uppercase;
    position:sticky; top:-8px; z-index:1; background:var(--panel); }
  .col h2 span { color:var(--fg); }
  .card { background:#0d1117; border:1px solid var(--line); border-radius:6px; padding:7px 8px; margin-bottom:7px; }
  .card .top { display:flex; gap:6px; align-items:baseline; }
  .card .n { color:var(--blue); font-weight:600; }
  .card .title { color:var(--fg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card .meta { color:var(--dim); font-size:12px; margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; }
  /* The Cell line: two lines under the meta line, and a third for the mark.
     "not on record" is a hole, drawn dim and italic in its place. */
  .card .cl { color:var(--dim); font-size:12px; margin-top:2px; }
  .card .cl .nr { font-style:italic; opacity:.65; }
  .card .cl.mark.amber { color:var(--amber); }
  .card .cl.mark.red { color:var(--red); }
  .ce-pulls { display:flex; gap:8px; flex-wrap:wrap; font-size:12px; margin-top:4px; }
  .ce-pulls a { color:var(--blue); text-decoration:none; }
  .ce-pulls .red { color:var(--red); }
  .card a { color:var(--blue); text-decoration:none; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; vertical-align:middle; }
  .dot.green{background:var(--green)} .dot.red{background:var(--red)} .dot.unknown{background:var(--dim)}
  .badge { border:1px solid var(--line); border-radius:10px; padding:0 6px; }
  .badge.flag { border-color:var(--red); color:var(--red); }
  footer { color:var(--dim); padding:10px 16px; border-top:1px solid var(--line); font-size:12px; }
  /* A pane carries its own display (grid, block), which would beat the UA's
     [hidden] rule; the closed tab's pane must stay closed. */
  [hidden] { display:none !important; }
  #tabs { display:flex; gap:4px; padding:8px 14px 0; border-bottom:1px solid var(--line); }
  #tabs a { color:var(--dim); text-decoration:none; padding:5px 14px; border:1px solid transparent; border-bottom:0;
    border-radius:6px 6px 0 0; margin-bottom:-1px; }
  #tabs a:hover { color:var(--fg); }
  #tabs a.on { color:var(--fg); background:var(--bg); border-color:var(--line); }
  /* A hash link's target flashes once on arrival. The duration is FLASH_MS in the script. */
  .card.flash { animation:flash 1.2s ease-out 1; }
  @keyframes flash { from { box-shadow:0 0 0 2px var(--blue); background:#12233a; } to { box-shadow:0 0 0 2px transparent; } }
  footer .filed { margin-top:4px; }
  #spend { padding:14px; flex:1 1 0; min-height:200px; overflow-y:auto; }
  #cells { padding:14px; flex:1 1 0; min-height:200px; overflow-y:auto; }
  .ce-links { color:var(--dim); margin-bottom:10px; font-size:12px; }
  .ce-links a { color:var(--blue); text-decoration:none; }
  .ce-sec { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:12px; }
  .ce-sec h2 { font-size:11px; letter-spacing:.06em; color:var(--dim); margin:0 0 6px; text-transform:uppercase; }
  .ce-verdict { font-weight:600; }
  .ce-verdict.trips { color:var(--amber); }
  .ce-source, .ce-note, .ce-foot, .ce-dim { color:var(--dim); font-size:12px; }
  .ce-note { margin-top:2px; }
  .ce-entry { border-top:1px solid var(--line); margin-top:10px; padding-top:8px; }
  .ce-hd { display:flex; gap:10px; flex-wrap:wrap; align-items:baseline; }
  .ce-cell { font-weight:600; }
  .ce-amber { color:var(--amber); }
  .ce-gen { margin:4px 0 0 0; padding:2px 0; }
  .ce-older { margin:2px 0 0 18px; color:var(--dim); }
  .ce-fig { display:flex; gap:8px; flex-wrap:wrap; font-size:12px; }
  .ce-lbl { color:var(--dim); min-width:9em; }
  .ce-beside { color:var(--dim); }
  .ce-foot { margin-top:8px; }
  #cells-declared summary { cursor:pointer; color:var(--dim); }
  .ce-member { display:flex; gap:10px; flex-wrap:wrap; font-size:12px; margin:2px 0 0 18px; }
  .ce.flash { animation:flash 1.2s ease-out 1; }
  .spend-wrap { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .spend-hd { display:flex; align-items:baseline; gap:10px; margin-bottom:8px; }
  .spend-hd h2 { font-size:11px; letter-spacing:.06em; color:var(--dim); margin:0; text-transform:uppercase; }
  .spend-hd .lede { color:var(--fg); }
  .spend-hd .note { color:var(--dim); font-size:11px; margin-left:auto; }
  .spend-cols { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:900px) { .spend-cols { grid-template-columns:1fr; } }
  .spend-cols h3 { font-size:11px; color:var(--dim); margin:0 0 6px; font-weight:600; letter-spacing:.04em; }
  .srow { display:grid; grid-template-columns:8.5em 3.4em 1fr 3em; gap:8px; align-items:center; margin-bottom:3px; font-size:12px; }
  .srow .lbl { color:var(--fg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .srow .num { color:var(--dim); text-align:right; }
  .srow .pct { color:var(--dim); text-align:right; }
  .bar { background:#0d1117; border-radius:3px; height:9px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--blue); }
  .bar i.rev { background:var(--amber); }
</style>
</head>
<body>
<header><h1 id="heading">🛰 fleet cockpit</h1><span id="age"></span></header>
<div id="stale-banner"></div>
<div id="attention"></div>
<nav id="tabs"><a id="tab-board" class="on" href="#board" aria-current="page">Board</a><a id="tab-cells" href="#cells">Cell evidence</a><a id="tab-tokens" href="#tokens">Tokens</a></nav>
<div id="board"></div>
<div id="cells" hidden></div>
<div id="spend" hidden></div>
<footer id="footer"></footer>
<script>
const COLUMNS = ["POOL", "IMPLEMENTING", "REVIEW", "READY", "MERGED"];
let interval = 15;
let repoUrl = null; // full repo URL from the model (carries the host) — PR links, GHE-safe

// The instance's name, for the tab strip and the header. Two cockpits
// are two WORKSPACES, and until this the pair rendered one constant twice —
// the operator's only way to tell two open windows apart was to read the
// tickets on them. `repo` has ridden the payload since the board existed and
// nothing on the page ever read it.
//
// Truthiness, not a null check: `gh repo view` failing leaves gather()'s
// `repo` null, a malformed answer can leave it "", and the identity stub
// served before the first tick carries no `repo` key at all. All
// three mean "this board cannot name its repo", and all three must render
// today's constant rather than `fleet cockpit — undefined`.
//
// Returned rather than assigned: this page is served as one self-contained
// file with no build and no DOM harness, so a decision is testable only as a
// pure function something can lift out of the source — the seam spendView and
// ledgerBanner already use.
const TITLE = "fleet cockpit";
function boardTitle(repo) { return repo ? `${TITLE} — ${repo}` : TITLE; }

// Where a URL hash lands: which tab is open, and what to bring into view on it.
// The router's whole decision, as a value with no DOM or location touched, so
// it is liftable out of the source the way spendView is. It closes over
// nothing, for the same reason.
//
// Every hash the page draws is a tab (`#board`, `#cells`, `#tokens`), a card on
// the Board (`#board/<issue>`, the issue number as a string) or a place on Cell
// evidence: a section (`#cells/guard`, `#cells/declared`), a Cell
// (`#cells/<cell>`) or one of its generations (`#cells/<cell>@<generation>`).
// Anything else — no hash, a tab the page does not have, a target the tab does
// not have — lands on Board's top, or the named tab's top, never on a blank
// page and never on an error.
function routeHash(hash) {
  const [tab, target, ...more] = String(hash).replace(/^#/, "").split("/");
  if (tab === "board") return { tab, target: more.length === 0 && /^[1-9]\d*$/.test(target) ? target : null };
  if (tab === "cells") {
    const place = /^(guard|declared|(slow|task|smol)-(minimal|low|medium|high|xhigh|max)(@[^\s/@]+)?)$/;
    return { tab, target: more.length === 0 && place.test(target ?? "") ? target : null };
  }
  if (tab === "tokens") return { tab, target: null };
  return { tab: "board", target: null };
}

// The element a route's target names: a card on Board, a section, a Cell or a
// generation on Cell evidence.
function anchorId(tab, target) {
  if (tab === "board") return "card-" + target;
  return target === "guard" || target === "declared" ? "cells-" + target : "cell-" + target;
}

// Each tab, and the pane it opens.
const PANES = { board: "board", cells: "cells", tokens: "spend" };

// Which target is still owed a scroll. The cards are rebuilt every tick, so a
// hash that arrives before the first render (a reload, a pasted link) cannot
// scroll yet: it waits here for the render.
let rendered = false;
let pending = null;

// The element flashing now (by id), and when it started. A tick rebuilds every
// card and every entry, so the flash lives here rather than on a node the next
// tick throws away. FLASH_MS is `.card.flash`'s animation duration, and
// `.ce.flash`'s.
const FLASH_MS = 1200;
let flashing = null;

// Whether "Declared, not measured" is open. A tick rebuilds it, and an open
// section that closed itself every 15 seconds would not stay open to be read.
let declaredOpen = false;

const el = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const mins = (ms) => Math.floor((Date.now() - ms) / 60000);

// A run's headline is routinely tens of millions, where "48785k" is unreadable.
const k = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1000 ? (n / 1000).toFixed(0) + "k" : String(Math.round(n)));

function spendRows(host, items, { label, value, pct, highlight }) {
  for (const it of items) {
    const row = el("div", "srow");
    const lbl = el("span", "lbl", label(it));
    lbl.title = label(it); // the column ellipsises; long tool names are unreadable without this
    row.append(lbl, el("span", "num", value(it)));
    const bar = el("div", "bar");
    const fill = el("i", highlight?.(it) ? "rev" : null);
    fill.style.width = Math.max(1, Math.round(pct(it))) + "%";
    bar.append(fill);
    row.append(bar, el("span", "pct", pct(it).toFixed(0) + "%"));
    host.append(row);
  }
}

// Which of the spend panel's outcomes the tri-state `spend` contract lands on,
// and the strings that outcome needs — as a value, with no DOM touched. The
// branching lives here rather than in renderSpend below because this page has no
// other test seam: it is served as one self-contained file, so a test reaches
// this decision only by lifting it out of the source and calling it directly,
// which a test does. That gap is not academic — the falsy-cacheWrite
// case below shipped broken and its fix shipped untested, because until this
// split there was nothing a test could call.
//
// `kind` is the tag the renderer switches on; "hidden" appends nothing at all.
// Both text-only outcomes carry the same `text` field because both render as one
// `spend-wrap` div, differing only in wording.
function spendView(sp) {
  // The damaged-lines phrase, shared by both the early note-only branch and the funded
  // panel's note below, so a rewording can't update one copy and silently
  // miss the other. It names the LINES, not the files: one transcript can
  // hold several damaged lines, and "1 transcript damaged" would read as a
  // whole agent lost — which is what `skipped` means and this does not.
  const damagedPhrase = (n, suffix = "") => `${n} damaged transcript line${n === 1 ? "" : "s"}${suffix}`;
  if (!sp) return { kind: "hidden" }; // genuinely nothing yet — normal at run start
  // A read failure is a bug the operator has to act on, and it used to look
  // exactly like an idle run. stderr is not a channel here: the board is
  // launched backgrounded and the operator is watching this page, not a log.
  //
  // Switch on `ok`, gatherSpend's explicit tag, and never on `error`. Reading
  // the error case off `error`'s truthiness was a bug: `{ error: "" }` and
  // `{ error: undefined }` — both of which the producer's outer catch can emit,
  // from a message-less throw and a thrown non-Error — matched neither this
  // branch nor a success shape, so they fell through, found no totals, and HID
  // the panel. That is the fault-as-idle-run conflation this branch exists to
  // remove, reappearing one field over.
  //
  // `!sp.ok`, not `sp.ok === false`, so an UNTAGGED payload is an error too.
  // That direction is deliberate: an old `board.json` still on disk after an
  // upgrade renders a loud "spend unavailable" and self-heals on the next tick
  // (~15s), where the other bias would route a legacy `{ error: "…" }` to
  // hidden — trading a visible, temporary wrong answer for an invisible one.
  //
  // An empty or absent message loses only the wording, never the panel: the tag
  // has already decided. `|| "no reason given"` is `ledger.mjs`'s idiom for the
  // same shape ("gh failed without saying why").
  if (!sp.ok) return { kind: "error", text: "spend unavailable: " + (sp.error || "no reason given") };
  // Zeroes would read as "this run was free", a worse lie than absence — but a
  // skipped count is not a zero, and hiding it here re-created the exact
  // conflation this panel exists to remove: "3 of 4 transcripts unreadable"
  // rendered identically to "nothing yet". stderr does not cover it (see
  // above), so the note goes out on its own, without the zeroed two-column body.
  if (!sp.totals || !sp.totals.cacheWrite) {
    // The damaged-lines worst case: when a damaged line WAS the run's only cache-creation
    // turn there is nothing left to sum, so cache-write is 0 with `skipped`
    // also 0 — a freshly-dispatched agent with no cache-creation turn flushed
    // yet can land here too, which is why `damaged` alone, without `skipped`,
    // must still be checked rather than assumed impossible. Measured before
    // `damaged` existed, that run rendered `hidden` — a destroyed run shown
    // as a run that had not started.
    const bits = [];
    if (sp.skipped) bits.push(`${sp.skipped} transcript${sp.skipped === 1 ? "" : "s"} skipped`);
    if (sp.damaged) bits.push(damagedPhrase(sp.damaged));
    return bits.length
      ? { kind: "note", text: `${bits.join("; ")}; no spend recorded yet` }
      : { kind: "hidden" };
  }
  return {
    kind: "panel",
    lede: `${k(sp.totals.cacheWrite)} cache-write · ${k(sp.totals.cacheRead)} cache-read · ${k(sp.totals.output)} output · ${sp.totals.agents} agents · review ${sp.reviewPct.toFixed(0)}%`,
    // `skipped` means "contributed nothing"; `damaged` means "contributed, but
    // may be missing the torn line's tool_use blocks and output_tokens
    // snapshot" — cache_creation/cache_read repeat on every line
    // of a turn and survive a mid-turn tear, so the panel's totals are not
    // necessarily short. Two different
    // lies, so two different phrases, both routed through the one channel that
    // already reaches the browser every tick. Listed in that order: most spend
    // lost first, so the one that most changes how to read the lede is read
    // first.
    note: [
      sp.skipped ? `${sp.skipped} transcript${sp.skipped === 1 ? "" : "s"} skipped` : null,
      sp.damaged ? damagedPhrase(sp.damaged, " — spend may be incomplete") : null,
      "ranked on cache-creation; tool split is attributed, not billed",
    ].filter(Boolean).join("; "),
    // These bars are percentages of the ATTRIBUTED subtotal, not of the headline
    // number: only a turn FOLLOWING a tool result can be charged to a tool, and an
    // agent's first turn — usually its single largest write — follows nothing. Say
    // what fraction is covered, so the two columns are not read as one base.
    // `!= null` rather than truthiness, so a genuine 0% still says so.
    toolHeading: sp.attributedPct != null
      ? `by tool — ${sp.attributedPct.toFixed(0)}% of cache-write attributed`
      : "by tool",
    roles: sp.roles || [],
    tools: (sp.tools || []).slice(0, 8),
  };
}

// Two views of one run: WHO spent it (role) and WHAT it went on (tool). The two
// percentage columns do NOT share a base — role pct is over total cache-write,
// tool pct is over the attributable subset only (turns following a tool result).
// Read each column against itself, never across.
function renderSpend(sp) {
  const host = document.getElementById("spend");
  host.innerHTML = "";
  const v = spendView(sp);
  if (v.kind === "hidden") return;
  if (v.kind !== "panel") { host.append(el("div", "spend-wrap", v.text)); return; }

  const wrap = el("div", "spend-wrap");
  const hd = el("div", "spend-hd");
  hd.append(el("h2", null, "tokens"));
  hd.append(el("span", "lede", v.lede));
  hd.append(el("span", "note", v.note));
  wrap.append(hd);

  const cols = el("div", "spend-cols");
  const byRole = el("div");
  byRole.append(el("h3", null, "by member role"));
  spendRows(byRole, v.roles, {
    label: (r) => `${r.role} ×${r.agents}`,
    value: (r) => k(r.cacheWrite),
    pct: (r) => r.pct,
    highlight: (r) => r.role === "reviewer" || r.role === "specialist",
  });
  const byTool = el("div");
  byTool.append(el("h3", null, v.toolHeading));
  spendRows(byTool, v.tools, {
    label: (t) => `${t.tool} ×${t.calls}`,
    value: (t) => k(t.cacheWrite),
    pct: (t) => t.pct,
  });
  cols.append(byRole, byTool);
  wrap.append(cols);
  host.append(wrap);
}

// A rebuilt element picks a flash up where it was, not from the start.
function resumeFlash(node) {
  const age = flashing && flashing.id === node.id ? Date.now() - flashing.at : Infinity;
  if (age < FLASH_MS) flash(node, age);
}

// An anchored element on the tab: the target of a hash link, flashing if it is
// the one that was just arrived at.
function ceBox(tag, cls, id) {
  const box = el(tag, "ce " + cls);
  if (id) { box.id = id; resumeFlash(box); }
  return box;
}

// One figure of a Cell's generation: its label, its words, what sits beside it
// and the footnote marks on it. Every word is the model's (compute-cell-evidence.mjs).
function ceFigure(label, text, beside = [], marks = []) {
  const row = el("div", "ce-fig");
  row.append(el("span", "ce-lbl", label), el("span", null, text));
  for (const b of beside) row.append(el("span", "ce-beside", "· " + b));
  if (marks.length) row.append(el("span", "ce-beside", marks.join(", ")));
  return row;
}

// A generation with figures: the three, under its own anchor.
function ceGeneration(f) {
  const box = ceBox("div", "ce-gen", f.anchor);
  box.append(
    ceFigure("merged PRs", f.merged.text, f.merged.beside, f.merged.marks),
    ceFigure("fail rate", f.failRate.text, f.failRate.beside),
    ceFigure("$ per merged PR", f.usd.text),
  );
  return box;
}

// An older generation, nested under its Cell and marked not judged.
function ceOlder(o) {
  const box = ceBox("div", "ce-older", o.anchor);
  box.append(el("div", null, `${o.generation} · ${o.mark}`),
    ceFigure("merged PRs", o.merged), ceFigure("fail rate", o.failRate), ceFigure("$ per merged PR", o.usd));
  return box;
}

// One Cell's entry: its header line, then its figures or "no figures yet", a
// "no figures yet" for each generation a card links to that has none, its older
// generations, and this run's Pulls booked to it, each linking to its card.
function ceEntry(e) {
  const box = ceBox("div", "ce-entry", e.anchor);
  const hd = el("div", "ce-hd");
  hd.append(el("span", "ce-cell", e.cell));
  if (e.baseline) hd.append(el("span", "badge", "baseline"));
  if (e.judged) hd.append(el("span", "ce-dim", e.judged));
  hd.append(el("span", "ce-dim", e.route.text));
  if (e.route.flag) hd.append(el("span", "ce-amber", e.route.flag));
  if (e.route.label) hd.append(el("span", "ce-amber", e.route.label));
  box.append(hd);
  if (e.figures) box.append(ceGeneration(e.figures));
  else {
    const none = ceBox("div", "ce-gen", e.none.anchor);
    none.append(el("span", "ce-dim", e.none.text));
    if (e.none.marks.length) none.append(el("span", "ce-beside", " " + e.none.marks.join(", ")));
    box.append(none);
  }
  for (const u of e.unfigured || []) {
    const none = ceBox("div", "ce-gen", u.anchor);
    none.append(el("span", "ce-dim", u.text));
    box.append(none);
  }
  for (const o of e.older) box.append(ceOlder(o));
  if ((e.pulls || []).length) {
    const row = el("div", "ce-pulls");
    row.append(el("span", "ce-lbl", "this run's Pulls"));
    for (const p of e.pulls) {
      const a = el("a", null, "#" + p.issue);
      a.href = p.href;
      row.append(a);
      if (p.mark) row.append(el("span", p.mark.severity === "red" ? "red" : "ce-amber", p.mark.text));
    }
    box.append(row);
  }
  return box;
}

// The Cell evidence tab. The model is `m.cellEvidence`; this only lays it out.
// Every Cell and every generation the model names is drawn, so each hash link
// the page draws has its target.
function renderCells(ce) {
  const host = document.getElementById("cells");
  if (!ce) { host.replaceChildren(el("div", "spend-wrap", "no Cell evidence in this board yet")); return; }
  const g = ce.guard;

  const links = el("div", "ce-links");
  for (const [href, text] of [["#cells/guard", "the guard"], ["#cells/declared", "declared, not measured"]]) {
    if (links.children.length) links.append(document.createTextNode(" · "));
    const a = el("a", null, text);
    a.href = href;
    links.append(a);
  }

  const sec = ceBox("section", "ce-sec", "cells-guard");
  sec.append(el("h2", null, "The guard: what it holds each Cell to"), el("div", "ce-verdict " + g.state, g.heading));
  if (g.source) sec.append(el("div", "ce-source", g.source));
  for (const n of g.notes) sec.append(el("div", "ce-note", n));
  for (const e of g.cells) sec.append(ceEntry(e));
  for (const f of g.footnotes) sec.append(el("div", "ce-foot", `${f.mark} ${f.text}`));

  const dec = ceBox("details", "ce-sec", "cells-declared");
  dec.open = declaredOpen;
  dec.addEventListener("toggle", () => { declaredOpen = dec.open; });
  dec.append(el("summary", null, ce.declared.heading));
  for (const m of ce.declared.members) {
    const row = el("div", "ce-member");
    row.append(el("span", null, m.name), el("span", "ce-dim", m.declared ?? "no Declared tier"), el("span", null, m.route));
    dec.append(row);
  }

  host.replaceChildren(links, sec, dec);
}

function render(m) {
  // A ticket whose column is none of COLUMNS matches no column's filter below
  // and would vanish from the board with nothing said. Throwing before any
  // write at all — the title, heading and attention strip included, not only
  // the columns — lets poll()'s catch banner it while the whole board stays
  // on the previous tick, never new header over old columns.
  for (const t of m.tickets || []) {
    if (!COLUMNS.includes(t.column)) throw new Error(`ticket #${t.issue} has unknown column ${JSON.stringify(t.column)}`);
  }
  interval = m.interval || 15;
  repoUrl = m.repoUrl || null;
  // Every render, never once at startup: a board whose repo read fails on a
  // later tick goes BACK to the constant, and one whose repo arrives late
  // (the pre-first-tick stub carries none) picks it up on the tick after.
  // The emoji stays out of the tab title — a tab strip has no room for it,
  // and the document's own <title> is the constant this falls back to.
  const name = boardTitle(m.repo);
  document.title = name;
  document.getElementById("heading").textContent = "🛰 " + name;
  // attention strip
  const att = document.getElementById("attention");
  att.innerHTML = "";
  for (const t of m.attention || []) {
    // A link into the Board, never a new window: the hash carries the card.
    const a = el("a", "att");
    a.href = "#board/" + t.issue;
    a.append(el("span", "n", "#" + t.issue), document.createTextNode(" "));
    a.append(el("span", "flag", (t.flags || []).join(" ")));
    att.append(a);
  }
  // columns — each built once and kept, its contents rewritten every tick.
  // A column scrolls on its own and a scroll offset lives on
  // the element, so a tick that threw the columns away and built new ones
  // jumped every column back to the top within one poll. Keeping the node
  // keeps its scroll — and a scroll still in flight — with nothing to save
  // or restore. #board's own children ARE the column cache: nothing else
  // ever appends to or clears #board, so board.children[i] is always
  // COLUMNS[i]'s node and no separate Map is needed to remember it: a
  // Map here could only ever agree with board.children or go
  // silently stale against it, never disagree usefully. Every column's
  // contents are built before any of them reach the DOM, so a ticket that
  // makes card() throw partway through leaves EVERY column on the previous
  // tick together — never some columns on the new tick and others frozen on
  // the old one, a mixed-tick board that could look like a normal render
  // (poll()'s own catch below still banners the failure).
  const board = document.getElementById("board");
  const q = m.queue || {};
  const next = COLUMNS.map((name) => {
    const inCol = (m.tickets || []).filter((t) => t.column === name);
    const h = el("h2", null, name + " ");
    // POOL's own count is `q.pool` — the same number, except that a
    // capped pool read makes it `"100+"`, and a header reading a bare 100
    // beside a footer reading 100+ would be the exact claim the `+` retracts.
    // A pool that was not read is null and shows `?`, never an empty count.
    h.append(el("span", null, String(name === "POOL" ? poolCount(q, inCol.length) : inCol.length)));
    return [h, ...inCol.map(card)];
  });
  COLUMNS.forEach((name, i) => {
    let col = board.children[i];
    if (!col) board.append(col = el("div", "col"));
    col.replaceChildren(...next[i]);
  });
  renderSpend(m.spend);
  renderCells(m.cellEvidence);
  // Computed here, ahead of the footer, not only inside the banner
  // arm below. The banner is a single slot behind a stale/stall/ledger
  // priority chain (next section): whenever any of those also fires on the
  // same tick, that chain's capMsg arm never runs, and an open-PR cap has no
  // other surface — unlike the pool cap, which always keeps its `n+` in the
  // header and footer above regardless of the banner. Appending it to the
  // footer, which does not compete for that slot, is what stops a
  // co-occurring higher-priority message from silently swallowing this one
  // (found by review: capNotice was reachable but unrenderable whenever
  // ledgerMsg/stallMsg/stale also held).
  const capMsg = m.capNotice ? "⚠ " + m.capNotice : null;
  // The footer too, for capMsg's reason: a higher-priority banner must not
  // swallow the one line that says POOL and READY were not read.
  const mapMsg = m.labelMapNotice ? "⚠ " + m.labelMapNotice : null;
  // footer
  const foot = document.getElementById("footer");
  foot.innerHTML = "";
  foot.append(el("div", null, `pool ${poolCount(q, 0)} · supply ${q.supply === null ? "?" : q.supply ?? 0} · review-backlog ${q.reviewBacklog ?? 0}`));
  if (mapMsg) foot.append(el("div", null, mapMsg));
  if (capMsg) foot.append(el("div", null, capMsg));
  const filed = el("div", "filed", `filed follow-ups (${(m.filed || []).length}): ` +
    (m.filed || []).map((f) => "#" + f.issue).join(" "));
  foot.append(filed);
  // freshness
  // Exactly one payload reaches this page without a `generatedAt` —
  // the identity stub, written at bind time so a racing launch's probe has
  // something to read. The page can now SEE it, because the cockpit answers
  // HTTP while its first tick is still computing where it used to answer
  // nothing at all until the tick was done. Only computeBoard() sets the
  // field, so its absence means "no board built yet", not "a board of unknown
  // age" — and `mins(undefined)` is NaN, which rendered as "updated NaNm ago".
  const built = typeof m.generatedAt === "number";
  document.getElementById("age").textContent = built ? "updated " + mins(m.generatedAt) + "m ago" : "building…";
  const banner = document.getElementById("stale-banner");
  const ledgerMsg = ledgerBanner(m.ledgerState);
  const stallMsg = livenessBanner(m.liveness);
  // Best-effort placement in the single banner slot when nothing
  // higher-priority holds it — ranked last, since stale/a stall/an unread
  // ledger each say the board is wrong wholesale, versus this notice, which
  // only says it may be short at one edge. The footer append above is what
  // actually guarantees this notice reaches the operator on a tick where a
  // higher-priority arm wins the slot instead.
  // Every banner writer goes through showBanner, which assigns the class as
  // well as the text: this element is reused across ticks, so a `dead` class
  // left behind by an earlier write would paint the next message red. Routing
  // every writer through the one setter, rather than one assignment per arm,
  // is what makes that unreachable rather than unlikely.
  if (built && Date.now() - m.generatedAt > interval * 1000 * 2) {
    showBanner("⚠ data stale — server/controller stopped?");
  } else if (stallMsg) {
    showBanner(stallMsg, "dead");
  } else if (ledgerMsg) {
    showBanner(ledgerMsg);
  } else if (mapMsg) {
    showBanner(mapMsg);
  } else if (capMsg) {
    showBanner(capMsg);
  } else { banner.style.display = "none"; banner.className = ""; }
  // Last, once the banner and footer have taken their place in the layout, so
  // a card scrolled to is scrolled to where it will stay.
  rendered = true;
  // Its own catch: the board above is already written, so a failed scroll is
  // not a failed render.
  try { settle(); } catch (e) { warn("⚠ scroll to card failed: " + e.message); }
}

// The heartbeat's mark, rendered. A dead run's tickets keep the label
// that marks them in flight, and the candidate scan EXCLUDES that label, so a
// run that stopped silently costs the night AND strands its tickets out of
// sight of the next run's scans. This is the surface that says so while the
// cockpit is still up; fleet-tick's start says it when nothing survived.
//
// The words are NOT composed here. `text` is computed by compute-board.mjs
// through fleet-state.mjs's stallReport(), the same function fleet-tick
// prints, so the two surfaces cannot describe one dead run differently. This
// function owns exactly one decision — whether there is a banner at all —
// and a payload with no `text` yields no banner rather than an empty one.
// The `l` check alone already covers a board.json written before this field
// existed (`liveness` is simply absent there, `undefined`, caught by `l &&`)
// — what the SECOND guard defends against is a hand-edited or partially
// written board.json carrying a truthy `liveness` object with no `text` of
// its own: `⚠ undefined` is worse than no banner at all.
//
// Ranked BELOW "data stale" at the call site above, deliberately. A board
// that stopped updating cannot be trusted to say anything current about the
// beat — its liveness field is as old as the rest of it — and announcing a
// death off a frozen page is the cry-wolf direction. Above the ledger
// messages, which report a degraded read of one input; this reports that
// nobody is working the board at all.
function livenessBanner(l) {
  return l && l.text ? "⚠ " + l.text : null;
}

// POOL's count: `?` for a pool the board did not read (`pool: null`),
// `fallback` for a payload with no `queue.pool` at all.
function poolCount(q, fallback) {
  return q.pool === null ? "?" : q.pool ?? fallback;
}

// Three ledger states, three renderings. `read` refuses an absent ledger
// under --require-file now, so gather() can tell "there was no ledger to read"
// from "read it, nothing filed yet" from "read it, the answer would not parse".
// All three used to arrive here as the same empty lists and drew the same empty
// board, which reads as a quiet run rather than a broken one.
//
// A ledger read empty gets no banner at all: it is the ordinary state of a run
// that has just started, and a warning there would fire on every first tick and
// train the operator to ignore this strip. Stale outranks both messages at the
// call site above — it says the whole board is old, not that one read failed.
function ledgerBanner(state) {
  if (state === "unread") return "⚠ ledger not read — no ledger file, or it could not be read (see --ledger / stderr)";
  if (state === "unparsed") return "⚠ ledger read did not parse — this board is incomplete";
  return null;
}

function card(t) {
  const c = el("div", "card");
  c.id = "card-" + t.issue;
  const top = el("div", "top");
  top.append(el("span", "n", "#" + t.issue));
  top.append(el("span", "title", t.title || ""));
  c.append(top);
  const meta = el("div", "meta");
  if (t.agent) meta.append(el("span", null, t.agent));
  if (t.pr != null) {
    const a = el("a", null, "PR#" + t.pr);
    a.href = repoUrl ? repoUrl + "/pull/" + t.pr : "#";
    a.target = "_blank"; a.rel = "noopener";
    meta.append(a);
  }
  if (t.ci) { const d = el("span", "dot " + t.ci); meta.append(d); }
  if (t.sinceEnteredStage) meta.append(el("span", null, mins(t.sinceEnteredStage) + "m"));
  for (const f of t.flags || []) meta.append(el("span", "badge flag", f));
  if (t.ruling) meta.append(el("span", "badge", "ruled:" + t.ruling));
  c.append(meta);
  if (t.cellLine) {
    for (const line of t.cellLine.lines) c.append(cellLineRow(line));
    if (t.cellLine.mark) c.append(el("div", "cl mark " + t.cellLine.mark.severity, t.cellLine.mark.text));
  }
  resumeFlash(c);
  return c;
}

// One line of a card's Cell line: its parts, each after its own separator. A
// part with an `href` is a hash link, a guard entry or a policy row on Cell
// evidence, and opens in this window; a hole ("not on record") is drawn dim and
// italic in its place. Every word is the model's (compute-board.mjs's cellLine).
function cellLineRow(parts) {
  const row = el("div", "cl");
  for (const p of parts) {
    if (p.sep) row.append(document.createTextNode(p.sep));
    const node = el(p.href ? "a" : "span", p.dim ? "nr" : null, p.text);
    if (p.href) node.href = p.href;
    row.append(node);
  }
  return row;
}

// The one writer of a shown banner: display, class and text move together, so
// no caller can show a message while a previous caller's class is still set.
function showBanner(text, cls = "") {
  const banner = document.getElementById("stale-banner");
  banner.style.display = "block";
  banner.className = cls;
  banner.textContent = text;
}

function warn(msg) {
  showBanner(msg);
}

// Opens the tab the hash names and settles the target it names. Every pane
// stays in the page either way, so a tick keeps filling all of them.
function applyHash() {
  const r = routeHash(location.hash);
  for (const [t, pane] of Object.entries(PANES)) {
    const on = t === r.tab;
    document.getElementById(pane).hidden = !on;
    const a = document.getElementById("tab-" + t);
    a.classList.toggle("on", on);
    if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  }
  pending = r;
  settle();
}

// The arrival: the target scrolls into view and flashes once; no target, or a
// target nothing on the page carries, lands on the tab's top. Taken off
// `pending` first, so a later tick never scrolls the page again; nothing
// settles before the first render.
function settle() {
  if (!pending || !rendered) return;
  const { tab, target } = pending;
  pending = null;
  const hit = target && document.getElementById(anchorId(tab, target));
  if (!hit) {
    window.scrollTo(0, 0);
    document.getElementById(PANES[tab]).scrollTop = 0;
    return;
  }
  // "Declared, not measured" opens on click and on a link to it.
  if (hit.id === "cells-declared") { hit.open = true; declaredOpen = true; }
  hit.scrollIntoView({ block: "center" });
  flashing = { id: hit.id, at: Date.now() };
  flash(hit, 0);
}

// Runs the flash on a card `age` ms into it.
function flash(node, age) {
  node.classList.remove("flash");
  void node.offsetWidth; // restart the animation when the same card is targeted again
  node.style.animationDelay = -age + "ms";
  node.classList.add("flash");
  node.addEventListener("animationend", () => node.classList.remove("flash"), { once: true });
}

async function poll() {
  let r;
  try {
    r = await fetch("/board.json", { cache: "no-store" });
  } catch (e) {
    warn("⚠ cockpit server not running");     // transport failure only — server unreachable
    setTimeout(poll, interval * 1000);
    return;
  }
  if (!r.ok) {
    warn("⚠ board.json HTTP " + r.status);      // server up, but no readable board yet (e.g. first tick failed)
  } else {
    // Parse + render sit OUTSIDE the transport try: a corrupt payload or a
    // render bug is NOT a dead server, and must not be mislabelled as one.
    try { render(await r.json()); }
    catch (e) { warn("⚠ board render failed: " + e.message); }
  }
  setTimeout(poll, interval * 1000);
}

// Clicking the link to the hash already open fires no hashchange, so the
// click is routed to applyHash by hand: a card scrolled away from can be
// brought back by the same link.
function boot() {
  window.addEventListener("hashchange", applyHash);
  document.addEventListener("click", (e) => {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    const a = e.target.closest?.('a[href^="#"]');
    if (a && a.getAttribute("href") === location.hash) { e.preventDefault(); applyHash(); }
  });
  applyHash();
  poll();
}
boot();
</script>
</body>
</html>
