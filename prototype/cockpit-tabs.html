<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>fleet cockpit — prototype: tabs</title>
<!--
  THROWAWAY PROTOTYPE for the "Tab layout on today's numbers" ticket of the
  "Cockpit tabs that explain why each Cell is used" map. Not shipped, never
  merged. One self-contained file, no build, like board.html. Data is baked in:
  origin/main ac26799a's records, the 2026-10-26 19:17Z guard on disk, a scratch
  Preview fit of ac26799a (198 Pulls), modelRoles as read 2026-10-27, and the
  2026-10-26 run's token panel. States marked "illustrative" are invented
  values for a state no workspace shows today.
-->
<style>
  :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --line:#30363d;
    --fg:#e6edf3; --dim:#8b949e; --red:#f85149; --amber:#d29922; --green:#3fb950; --blue:#58a6ff; --violet:#bc8cff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;
    height:100vh; display:flex; flex-direction:column; }
  body > * { flex:none; }
  a { color:var(--blue); text-decoration:none; }
  a:hover { text-decoration:underline; }
  header { display:flex; align-items:center; gap:18px; padding:8px 16px 0; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0 0 8px; font-weight:600; }
  #age { color:var(--dim); font-size:12px; margin-left:auto; margin-bottom:8px; }
  nav#tabs { display:flex; gap:2px; align-self:flex-end; }
  nav#tabs a { padding:6px 14px; border:1px solid transparent; border-bottom:none; border-radius:6px 6px 0 0; color:var(--dim); cursor:pointer; }
  nav#tabs a.on { color:var(--fg); border-color:var(--line); background:var(--bg); margin-bottom:-1px; }
  nav#tabs a .tmark { color:var(--amber); margin-left:6px; }
  #proto { background:#1c1530; color:var(--violet); padding:5px 16px; font-size:12px; border-bottom:1px solid var(--line); display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
  #proto select { background:var(--panel); color:var(--fg); border:1px solid var(--line); font:inherit; font-size:12px; }
  #proto .desc { color:var(--dim); }
  #stale-banner { display:none; background:var(--amber); color:#000; padding:6px 16px; font-weight:600; }
  #stale-banner.dead { background:var(--red); color:#fff; }
  .attention { padding:8px 16px; border-bottom:1px solid var(--line); background:#2d1618; }
  .attention:empty { display:none; }
  .att { display:inline-block; margin:2px 10px 2px 0; }
  .att .n { color:var(--blue); font-weight:600; }
  .flag { color:var(--red); font-weight:600; }
  main { flex:1 1 0; min-height:200px; display:flex; flex-direction:column; }
  main > section { display:none; flex:1 1 0; min-height:0; flex-direction:column; }
  main > section.on { display:flex; }
  #board { display:grid; grid-template-columns:repeat(5,1fr); grid-template-rows:minmax(0,1fr); gap:10px; padding:14px; align-items:start; flex:1 1 0; min-height:200px; }
  .col { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px; min-height:80px; max-height:100%; overflow-y:auto; }
  .col h2 { font-size:11px; letter-spacing:.06em; color:var(--dim); margin:-8px -8px 0; padding:10px 12px 8px; text-transform:uppercase; position:sticky; top:-8px; z-index:1; background:var(--panel); }
  .col h2 span { color:var(--fg); }
  .card { background:#0d1117; border:1px solid var(--line); border-radius:6px; padding:7px 8px; margin-bottom:7px; }
  .card .top { display:flex; gap:6px; align-items:baseline; }
  .card .n { color:var(--blue); font-weight:600; }
  .card .title { color:var(--fg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card .meta { color:var(--dim); font-size:12px; margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; }
  /* the Cell line */
  .cellline { font-size:12px; margin-top:5px; padding-top:5px; border-top:1px dashed var(--line); color:var(--dim); }
  .cellline .c1 { display:flex; gap:6px; flex-wrap:wrap; align-items:baseline; }
  .cellline .cell { color:var(--fg); font-weight:600; }
  .cellline .why { color:var(--fg); }
  .cellline .mark { color:var(--amber); margin-top:2px; }
  .cellline .mark.bad { color:var(--red); }
  .nr { color:var(--dim); font-style:italic; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; vertical-align:middle; }
  .dot.green{background:var(--green)} .dot.red{background:var(--red)} .dot.unknown{background:var(--dim)}
  .badge { border:1px solid var(--line); border-radius:10px; padding:0 6px; }
  .badge.flag { border-color:var(--red); color:var(--red); }
  footer { color:var(--dim); padding:8px 16px; border-top:1px solid var(--line); font-size:12px; }
  /* tokens tab */
  #spend { padding:14px; overflow-y:auto; }
  .spend-wrap { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .spend-hd { display:flex; align-items:baseline; gap:10px; margin-bottom:8px; }
  .spend-hd h2 { font-size:11px; letter-spacing:.06em; color:var(--dim); margin:0; text-transform:uppercase; }
  .spend-hd .lede { color:var(--fg); }
  .spend-hd .note { color:var(--dim); font-size:11px; margin-left:auto; }
  .spend-cols { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .spend-cols h3 { font-size:11px; color:var(--dim); margin:0 0 6px; font-weight:600; letter-spacing:.04em; }
  .srow { display:grid; grid-template-columns:8.5em 3.4em 1fr 3em; gap:8px; align-items:center; margin-bottom:3px; font-size:12px; }
  .srow .lbl { color:var(--fg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .srow .num, .srow .pct { color:var(--dim); text-align:right; }
  .bar { background:#0d1117; border-radius:3px; height:9px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--blue); }
  .bar i.rev { background:var(--amber); }
  /* Cell evidence tab */
  #cells { overflow-y:auto; padding:14px 18px 40px; }
  #cells .toc { color:var(--dim); font-size:12px; margin-bottom:10px; }
  .alert { background:#3a2a0a; border:1px solid var(--amber); color:var(--fg); border-radius:6px; padding:7px 10px; margin-bottom:8px; }
  .alert b { color:var(--amber); }
  .alert .sub { color:var(--dim); font-size:12px; }
  .sec { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:14px; }
  .sec > h2 { font-size:11px; letter-spacing:.06em; color:var(--dim); margin:0 0 8px; text-transform:uppercase; }
  .sides { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:8px; }
  .side { border-left:3px solid var(--line); padding-left:8px; }
  .side h3 { margin:0 0 2px; font-size:13px; }
  .side .src { color:var(--dim); font-size:12px; }
  .side .head { color:var(--fg); font-size:12px; margin-top:3px; }
  .lab { color:var(--amber); font-size:12px; }
  .lab.nc { color:var(--dim); font-style:italic; }
  sup.fn { color:var(--amber); }
  table.ev { width:100%; border-collapse:collapse; font-size:12px; }
  table.ev th { text-align:left; color:var(--dim); font-weight:600; padding:4px 6px; border-bottom:1px solid var(--line); vertical-align:bottom; }
  table.ev th.grp { text-align:center; border-bottom:1px solid var(--line); }
  table.ev td { padding:5px 6px; border-bottom:1px solid #21262d; vertical-align:top; }
  table.ev td.split { border-left:2px solid var(--line); }
  table.ev tr.live td:first-child { box-shadow: inset 3px 0 0 var(--green); }
  table.ev .cellv { color:var(--fg); font-weight:600; }
  table.ev .diff { color:var(--amber); font-weight:700; }
  table.ev .cand { color:var(--dim); }
  table.ev .cand b { color:var(--fg); font-weight:500; }
  table.ev .follows { color:var(--dim); font-style:italic; }
  .foot { color:var(--dim); font-size:12px; margin-top:6px; }
  .foot div { margin-top:2px; }
  .g-entry { border:1px solid var(--line); border-radius:6px; padding:7px 9px; margin-bottom:8px; background:#0d1117; }
  .g-entry .gh { display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
  .g-entry .gh .cell { font-weight:700; font-size:13px; }
  .g-entry .gh .gen { color:var(--dim); }
  .g-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin-top:5px; font-size:12px; }
  .g-grid .k { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  .g-grid .v { color:var(--fg); }
  .g-entry .older { margin-top:6px; padding-top:5px; border-top:1px dashed var(--line); font-size:12px; color:var(--dim); }
  .g-entry .pulls { margin-top:6px; font-size:12px; color:var(--dim); }
  .g-entry .pulls a { margin-right:8px; }
  .ok { color:var(--green); } .warn { color:var(--amber); } .bad { color:var(--red); }
  .flash { animation: flash 1.6s ease-out; }
  @keyframes flash { 0% { box-shadow:0 0 0 3px var(--violet); } 100% { box-shadow:0 0 0 0 transparent; } }
  table.decl td, table.decl th { padding:3px 8px; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1 id="heading">🛰 fleet cockpit</h1>
  <nav id="tabs">
    <a data-tab="board">Board</a>
    <a data-tab="cells">Cell evidence<span class="tmark" id="cells-mark"></span></a>
    <a data-tab="tokens">Tokens</a>
  </nav>
  <span id="age">updated 0m ago</span>
</header>
<div id="proto">
  <b>PROTOTYPE</b>
  <label>state <select id="scn"></select></label>
  <label>attention strip <select id="attpos"><option value="global">global, above the tabs</option><option value="board">Board tab only</option></select></label>
  <label>card Cell line <select id="cardform"><option value="full">full (3 lines)</option><option value="compact">compact (1 line, Stratum numbers on hover)</option></select></label>
  <span class="desc" id="scn-desc"></span>
</div>
<div id="stale-banner"></div>
<div id="attention-global" class="attention"></div>
<main>
  <section id="tab-board"><div id="attention-board" class="attention"></div><div id="board"></div></section>
  <section id="tab-cells"><div id="cells"></div></section>
  <section id="tab-tokens"><div id="spend"></div></section>
</main>
<footer id="footer"></footer>
<script>
// ---------------------------------------------------------------- helpers
const el = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const h = (t, cls, ...kids) => { const e = el(t, cls); for (const c of kids) if (c != null) e.append(typeof c === "string" ? document.createTextNode(c) : c); return e; };
const link = (txt, href, cls) => { const a = el("a", cls, txt); a.href = href; return a; };
const k = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1000 ? (n / 1000).toFixed(0) + "k" : String(Math.round(n)));
const pct = (x) => (x * 100).toFixed(1) + "%";
const pts = (x) => (x >= 0 ? "+" : "−") + Math.abs(x * 100).toFixed(1) + " pts";
const sgnPct = (x) => (x >= 0 ? "+" : "−") + Math.abs(x * 100).toFixed(1) + "%";
const lab = (txt, nc) => el("span", nc ? "lab nc" : "lab", txt);
const fn = (n) => el("sup", "fn", String(n));
const clone = (o) => JSON.parse(JSON.stringify(o));

// ---------------------------------------------------------------- records (baked in)
const MIN_N = 20, TRIP = 0.15;
const ROUTE_MODEL = { slow: "claude-opus-5-5", task: "claude-sonnet-5-5", smol: "claude-haiku-5-5" }; // omp config get modelRoles, 2026-10-27
const CELLS5 = ["slow-high", "task-high", "smol-high", "slow-medium", "task-max"];
const roleOf = (c) => c.split("-")[0];
const levelOf = (c) => c.split("-")[1];

// The guard on disk: 2026-10-26 19:17Z close-out, read tier-outcomes.tsv 9df10b12.
const GUARD_TODAY = {
  source: "this repository's runs", computed_at: "2026-10-26 19:17Z", window_start: "2026-10-03", verdict: "ok", tripped: [], baseline: "slow-high",
  entries: {
    "slow-high": { gen: "claude-opus-5-5", n: 69, fail: 0.1159, usd: 14.92, hand: [56, 69] },
    "task-high": { gen: "claude-sonnet-5-5", n: 69, fail: 0.2174, usd: 10.20, hand: [60, 69], excluded: 1 },
    "smol-high": { gen: "claude-haiku-5-5", n: 32, fail: 0.25, usd: 10.68, hand: [26, 32], excluded: 5, unpriced: 1 },
  },
};

// Scratch Preview fit of origin/main ac26799a against the 19:17Z guard: 198 Pulls, stage 2, burn-in.
const V = (cell, verdict, n, ci) => ({ cell, verdict, n, ci });
const FIT_ROWS = {
  cost: {
    "*": { cell: "task-high", why: "lower fail rate: two qualify, neither reliably cheaper ($ −3.46 to +2.23)", cands: [V("task-high", "qualifies", 69, "$ −7.75 to −1.98 per merged PR vs slow-high"), V("smol-high", "qualifies", 32, "$ −7.70 to −0.84")] },
    light: { cell: "task-high", why: "sole qualifier", cands: [V("task-high", "qualifies", 22, "$ −9.70 to −0.20"), V("smol-high", "too few", 13, "13 of 20")] },
    heavy: { cell: "task-high", why: "sole qualifier", cands: [V("task-high", "qualifies", 47, "$ −8.40 to −1.40"), V("smol-high", "too few", 19, "19 of 20")] },
  },
  speed: {
    "*": { cell: "task-high", why: "no qualifier: keeps the cost row's task-high", cands: [V("slow-high", "too slow", 69, "+0.78 to +37.32 min per merged PR vs task-high"), V("smol-high", "too slow", 32, "−6.12 to +33.14 min")] },
    light: { cell: "task-high", why: "no qualifier", cands: [V("slow-high", "too slow", 22, "+8.24 to +52.74 min"), V("smol-high", "too few", 13, "13 of 20")] },
    heavy: { cell: "task-high", why: "no qualifier", cands: [V("slow-high", "too slow", 47, "−11.05 to +35.31 min"), V("smol-high", "too few", 19, "19 of 20")] },
  },
};
const UNFITTED_ROWS = { cost: { "*": { cell: "slow-high", why: "unjudged: never fitted", cands: [] } }, speed: { "*": { cell: "slow-high", why: "unjudged: never fitted", cands: [] } } };
const unjudgedRows = (why) => ({ cost: { "*": { cell: "slow-high", why, cands: [] } }, speed: { "*": { cell: "slow-high", why, cands: [] } } });

// Declared, not measured: plugin/agents/*.agent.md minus the five implementer Cells.
const DECLARED = [
  ["fleet-fix-applier", "@slow:high"], ["fleet-review-correctness", "@slow:high"], ["fleet-review-simplify", "@slow:high"],
  ["fleet-review-silent-failure", "@task:high"], ["fleet-recipe-deriver", "@task:medium"], ["fleet-review-comments", "@task:medium"],
  ["fleet-review-tests", "@task:medium"], ["fleet-review-types", "@task:medium"], ["fleet-review-verifier", "@task:low"],
  ["fleet-finisher", "@smol:low"], ["fleet-merge-bot", "@smol:low"], ["fleet-review-runner", "@smol:low"],
  ["fleet-review-snapshot", "@smol:low"], ["fleet-review-test-run", "@smol:low"],
];

// The 2026-10-26 run's token panel, gatherSpend over its session since 13:04Z.
const SPEND = {
  ok: true, totals: { agents: 131, cacheWrite: 5702199, output: 1250230, cacheRead: 162813222 }, reviewPct: 67.2, attributedPct: 67.9, skipped: 0, damaged: 0,
  roles: [["specialist", 105, 3091427, 54.2], ["implementer", 3, 949338, 16.6], ["reviewer", 9, 741906, 13.0], ["other", 3, 341922, 6.0], ["merge-bot", 4, 278567, 4.9], ["finisher", 4, 191191, 3.4], ["memory", 2, 65410, 1.1], ["-", 1, 42438, 0.7]].map(([role, agents, cacheWrite, pct]) => ({ role, agents, cacheWrite, pct })),
  tools: [["bash", 1318, 1891159, 48.8], ["read", 392, 1036282, 26.8], ["grep", 130, 330335, 8.5], ["edit", 188, 238220, 6.2], ["eval", 52, 150163, 3.9], ["write", 31, 84392, 2.2], ["wait", 69, 65355, 1.7], ["yield", 63, 18452, 0.5]].map(([tool, calls, cacheWrite, pct]) => ({ tool, calls, cacheWrite, pct })),
};

const POOL_TODAY = [[3875, "The cockpit outlives its run: exit once the run's controller is gone"], [3874, "Label map documents: the ADR, requirements 2.4, the component doc, the glossary, and the retired out-of-scope note"], [3873, "claim-ticket.sh, release-ticket.sh and drop-merged-label.sh read the in-progress string from the Label map"], [3856, "merge-bot: end the grace once no PR is open"], [3853, "member-write-guard protects the main checkout, not the Install root a package install executes"], [3845, "instrument pin certifies the checkout's plugin/ while fleet-run executes the installed package"]];
const HEAVY = (chars, crit) => `heavy: ${chars} chars (past 3,483), ${crit} criteria (past 5)`;
const MERGED_TODAY = [
  { issue: 3747, title: "finisher: the acceptance mutation cannot go red on a prose-only PR, so every docs-only PR halts at the maintainer", pr: 3849,
    cl: { cell: "smol-high", gen: "claude-haiku-5-5", why: "drawn 2 of 3: burn-in", stratum: HEAVY("9,658", 8), model: "claude-haiku-5-5 · high" } },
  { issue: 3780, title: "instrument pin: record the pin commit, say what moved, escalate a moved pinned tree", pr: 3848,
    cl: { cell: "task-high", gen: "claude-sonnet-5-5", why: "drawn 3 of 3: burn-in", stratum: HEAVY("9,705", 8), model: "claude-sonnet-5-5 · high" } },
  { issue: 3748, title: "run-team: the tick never queues an open PR that closes no issue, so controller-authored chore and docs PRs need a hand-dispatched review and a manual label", pr: 3852,
    cl: { cell: "task-high", gen: "claude-sonnet-5-5", why: "drawn 3 of 3: burn-in", stratum: HEAVY("13,638", 11), model: "claude-sonnet-5-5 · high" } },
];
const STALLED = "⚠ heartbeat STALLED, controller gone: last beat 2026-10-26T19:17:14.588Z — stopped deliberately — recorded reason: maintainer requested drain; 0 ticket(s) claimed and in flight, pool supply 27";

// ---------------------------------------------------------------- the states
// Each state is a full view: what the page would be handed. Built from TODAY by edits.
function today() {
  return {
    repo: "feigi/fleet-plugin", banner: STALLED, attention: [],
    queue: { pool: 27, supply: 27, reviewBacklog: 0 },
    tickets: [...clone(MERGED_TODAY).map((t) => ({ ...t, column: "MERGED", ci: "unknown" })), ...POOL_TODAY.map(([issue, title]) => ({ issue, title, column: "POOL" }))],
    spend: SPEND,
    alerts: [{ b: "main's records changed after 2026-10-26 19:17Z; the next phase 0 recomputes", sub: "the guard read tier-outcomes.tsv blob 9df10b12; main holds 84123e74 (21 re-rules and the run's metrics PR merged since)" }],
    liveObjective: null,
    routes: {
      title: "Routes now", src: "this repository's runs · never fitted · @feigi/fleet-ctl 3.104.0", srcFn: null,
      head: "never fitted: every Pull drawn over 3 Cells", labels: [], rows: UNFITTED_ROWS, dispatch: "drawn over 3 Cells: slow-high, task-high, smol-high",
    },
    evidence: {
      title: "Evidence favours", src: "Preview fit · this repository's runs · computed 2026-10-26 19:17Z · 198 Pulls",
      head: "stage 2: slow-medium and task-max have 0 of the 20 merged PRs each needs", labels: [], rows: FIT_ROWS, dispatch: "drawn over 5 Cells: + slow-medium, task-max",
    },
    guard: { ...clone(GUARD_TODAY), heading: null, checks: [] },
    modelRoles: { ...ROUTE_MODEL }, modelRolesFail: null,
    footnotes: {},
  };
}

const STATES = [
  { id: "today", label: "this repo · today, as a phase 0 with the new fields would write it",
    desc: "origin/main ac26799a; guard 19:17Z; scratch Preview fit; cards as a Routing would hold them",
    make: () => today() },
  { id: "shipped", label: "this repo · today, as shipped before the next phase 0",
    desc: "guard predates the new fields; no Preview fit yet; card rows predate the Routing",
    make: () => {
      const v = today();
      v.alerts = [];
      v.guard.checks.push("records against main: not checked — this guard predates the blob ids it needs (written 2026-10-26 19:17Z by 3.104.0)");
      for (const e of Object.values(v.guard.entries)) { e.hand = "nc"; e.excluded = "nc"; e.unpriced = "nc"; }
      v.evidence = { ...v.evidence, src: "Preview fit · none on disk", head: "no Preview fit yet: the next phase 0 writes one [wording invented for this state]", rows: null };
      for (const t of v.tickets) if (t.cl) { t.cl.why = null; t.cl.stratum = null; }
      return v;
    } },
  { id: "c-skipped", label: "consumer · no cost guard: refresh skipped",
    desc: "fresh consumer, runs 1–2 (illustrative cards)", make: () => consumerNoGuard("skipped at 2026-10-27 08:12Z: docs/metrics/member-outcomes.tsv not found — no corpus to guard yet") },
  { id: "c-failed", label: "consumer · no cost guard: refresh failed",
    desc: "diagram-docs on v3.104.0 (20-column member-outcomes.tsv)", make: () => consumerNoGuard("failed at 2026-10-27 08:12Z: … malformed row: 20 fields, expected 23") },
  { id: "c-noreceipt", label: "consumer · no cost guard: no receipt",
    desc: "cockpit launched by hand before any run", make: () => consumerNoGuard("no phase 0 or close-out receipt here") },
  { id: "c-older", label: "consumer · newest refresh failed, older guard on disk",
    desc: "illustrative", make: () => {
      const v = consumerHoldsNothing();
      v.guard.heading = "the newest refresh failed at 2026-10-27 08:12Z: … malformed row: 20 fields, expected 23; these figures are from 2026-10-24 17:40Z";
      return v;
    } },
  { id: "c-none", label: "consumer · the guard holds nothing back",
    desc: "verdict none: slow-high has 7 of 20 (illustrative counts)", make: () => consumerHoldsNothing() },
  { id: "c-fitted", label: "consumer · a fitted release",
    desc: "3.105.0 ships main's fit (task-high every row, 198 Pulls); the consumer's own Preview fit is stage 2 with few Pulls (illustrative)", make: () => consumerFitted() },
  { id: "c-update", label: "consumer · after a plugin update; models differ; role unset; GHE host",
    desc: "illustrative", make: () => consumerUpdated() },
  { id: "gallery", label: "this repo · rare labels and card marks, once each",
    desc: "illustrative values on today's page", make: () => gallery() },
];

      if (e.excluded === "nc" || e.unpriced === "nc") nV.append(" ", lab("no Admissible row / unpriced: not checked", true));
      else {
        if (e.excluded) nV.append(note(`${e.excluded} drawn here ${e.excluded === 1 ? "has" : "have"} no Admissible row: ${e.excluded === 1 ? "it" : "they"} ran under another Cell, at another effort, or with no model on record, so ${e.excluded === 1 ? "it counts" : "they count"} in no Cell's figures`));
        if (e.unpriced) { if (e.excluded) nV.append(el("sup", "fn", ",")); nV.append(note(`${e.unpriced} unpriced: part of ${e.unpriced === 1 ? "its" : "their"} Spend can't be booked`)); }
      }
      grid.append(h("div", null, el("div", "k", "merged PRs (n)"), nV));
      const fV = el("div", "v");
      if (cell === g.baseline) fV.append(`${pct(e.fail)} · the floor is ${pct(e.fail + TRIP)}`);
      else {
        const gap = e.fail - base.fail, margin = TRIP - gap;
        fV.append(`${pct(e.fail)} · ${pts(gap)} on ${g.baseline} · `, el("span", margin > 0 ? "ok" : "bad", margin > 0 ? `${(margin * 100).toFixed(1)} pts inside the floor` : `${(-margin * 100).toFixed(1)} pts past the floor`));
      }
      if (e.hand === "nc") fV.append(" ", lab("Rulings given by hand: not checked", true));
      else if (e.hand && e.hand[0] > 0) fV.append(" ", lab(`${e.hand[0]} of ${e.hand[1]} Rulings given by hand`));
      grid.append(h("div", null, el("div", "k", "fail rate"), fV));
      const uV = el("div", "v", `$${e.usd.toFixed(2)}`);
      if (cell !== g.baseline) uV.append(` · ${sgnPct(e.usd / base.usd - 1)} on ${g.baseline}`);
      grid.append(h("div", null, el("div", "k", "$ per merged PR"), uV));
      box.append(grid);
      for (const o of e.older || []) {
        const od = el("div", "older"); od.id = `anchor-${cell}@${o.gen}`;
        od.append(`older generation ${o.gen}: n ${o.n} · fail rate ${pct(o.fail)} · $${o.usd.toFixed(2)} per merged PR — not judged (only the newest generation is)`);
        box.append(od);
      }
    }
    const mine = run.filter((t) => t.cl.cell === cell);
    const pulls = el("div", "pulls");
    pulls.append(document.createTextNode(mine.length ? "this run's Pulls: " : "this run's Pulls: none"));
    for (const t of mine) {
      pulls.append(link(`#${t.issue}`, `#board/${t.issue}`));
      if (t.cl.mark) pulls.lastChild.after(lab(`(${t.cl.markBad ? "no Admissible row" : "marked"}) `));
    }
    box.append(pulls);
    gs.append(box);
  }
  if (notes.length) { const f = el("div", "foot"); notes.forEach((t, i) => f.append(el("div", null, `${i + 1} ${t}`))); gs.append(f); }
  host.append(gs);

  // -- declared, not measured
  const ds = el("div", "sec"); ds.id = "anchor-sec/declared";
  ds.append(el("h2", null, `Declared, not measured — ${DECLARED.length} other members`));
  ds.append(el("div", "foot", "Their Declared tier is the definition's; no record judges them. The model is the Tier route the cockpit reads now."));
  const dt = el("table", "ev decl");
  dt.append(h("tr", null, el("th", null, "member"), el("th", null, "Declared tier"), el("th", null, "Tier route model")));
  for (const [name, tier] of DECLARED) {
    const [role, level] = tier.slice(1).split(":");
    const rm = v.modelRoles[role];
    dt.append(h("tr", null, el("td", null, name), el("td", null, tier), h("td", null, rm == null ? lab(`modelRoles.${role} unset: omp picks the model`, true) : `${rm} · ${level}`)));
  }
  ds.append(dt);
  host.append(ds);

  document.getElementById("cells-mark").textContent = v.alerts.length ? `⚠${v.alerts.length}` : "";
}

// ---------------------------------------------------------------- render
function render() {
  const s = STATES.find((x) => x.id === document.getElementById("scn").value);
  state = s.make();
  document.getElementById("scn-desc").textContent = s.desc;
  const name = `fleet cockpit — ${state.repo}`;
  document.title = name + " (prototype)";
  document.getElementById("heading").textContent = "🛰 " + name;
  const banner = document.getElementById("stale-banner");
  if (state.banner) { banner.style.display = "block"; banner.className = "dead"; banner.textContent = state.banner; } else banner.style.display = "none";
  renderBoard(state); renderCells(state); renderTokens(state.spend);
  const q = state.queue;
  const foot = document.getElementById("footer");
  foot.textContent = `pool ${q.pool} · supply ${q.supply} · review-backlog ${q.reviewBacklog}`;
  go();
}
const sel = document.getElementById("scn");
for (const s of STATES) { const o = el("option", null, s.label); o.value = s.id; sel.append(o); }
sel.onchange = render;
document.getElementById("attpos").onchange = render;
document.getElementById("cardform").onchange = render;
render();
</script>
</body>
</html>
