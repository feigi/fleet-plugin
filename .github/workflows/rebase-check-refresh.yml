# `rebase-check` only runs on `pull_request` events, so a PR that passed it keeps
# a stale green check after main advances. Note main is NOT a protected branch
# today (`gh api repos/.../branches/main/protection` → 404), so nothing blocks
# the merge and that stale green is the whole signal, not a cosmetic wart on top
# of a real gate. Making it a gate is the follow-up in the PR body. This workflow
# re-runs the real `rebase-check` job on open PRs targeting main whenever main
# moves, so the PR goes red with the actionable log line instead.
#
# Only PRs actually BEHIND their base are re-run: `POST
# /actions/jobs/{id}/rerun` re-runs a job AND ITS DEPENDENT JOBS, and re-running
# unconditionally would flip an already-green required check back to in-progress
# — blocking the merge it was meant to unblock. Gating on `behind_by > 0` avoids
# that; PRs that are up to date are never touched.
name: Refresh rebase-check

on:
  push:
    branches: [main]

permissions:
  actions: write
  pull-requests: read
  contents: read

# A newer main push supersedes an in-flight refresh — its PR list is strictly
# fresher. Not a clean supersession: reruns the cancelled run already POSTed stay
# in flight, and the replacement run will see those jobs as running and skip
# them (see .github/scripts/rerun-rebase-check.sh).
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The step below invokes `.github/scripts/rerun-rebase-check.sh` by
      # repo-relative path, so the repo has to be on the runner. Nothing in the
      # unit suite can observe this: it always runs the lifted step from a
      # checked-out tree, so a missing checkout there is 127 on the FIRST behind
      # PR — the `*` arm exits 1 and the workflow refreshes nothing at all.
      - uses: actions/checkout@v5
      - name: Re-run rebase-check on stale open PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Derive the host from the runner-provided server URL rather than
          # letting gh default to github.com, so this keeps working if the repo
          # ever lives on a GHE instance.
          export GH_HOST="${GITHUB_SERVER_URL#https://}"

          # `if !` rather than a bare assignment: `set -e` would abort here, but
          # silently, with no annotation in the run log.
          # `baseRefName` is requested even though the list is filtered to the
          # branch that was pushed: the compare below derives its base from it, so
          # widening or dropping the filter cannot silently measure a PR against
          # the wrong base.
          # `$GITHUB_REF_NAME`, not a literal `main`: this workflow only triggers
          # on a push to main, so the two agree by construction today — but a
          # hardcoded `main` that stops matching the default branch returns an
          # empty list, exits 0 at the guard below, and refreshes nothing forever.
          # One name for the cap, because the step both asks for it and reports
          # hitting it: two literals that have to agree are what made the
          # warning below fire a page early or late depending on which one moved.
          PR_LIMIT=100
          if ! PR_JSON=$(gh pr list --base "$GITHUB_REF_NAME" --state open --limit "$PR_LIMIT" \
                       --json number,baseRefName,headRefOid); then
            echo "::error::gh pr list failed"
            exit 1
          fi
          # Projected here rather than by `gh --jq` so the row count can be
          # cross-checked against the array gh actually returned, out of the
          # SAME response. A second `gh pr list --jq length` would disagree with
          # this one whenever a PR opened or closed between the two calls, and
          # report that race as a dropped row. It also deletes the failure mode
          # the cross-check was asked to detect rather than detecting it: a `gh`
          # upgrade changing `--jq` semantics cannot drop rows from a projection
          # gh no longer performs. `jq` is already a dependency of this step.
          if ! N=$(printf '%s' "$PR_JSON" | jq 'length'); then
            echo "::error::gh pr list returned output jq could not read as a JSON array"
            exit 1
          fi
          PRS=$(printf '%s' "$PR_JSON" | jq -r '.[] | "\(.number) \(.baseRefName) \(.headRefOid)"')

          # Decided from the count gh returned, not from an empty projection:
          # "the API had nothing to list" and "the projection produced nothing"
          # are the same empty string, and this is the most-taken path in the
          # workflow, so there is no baseline from which to notice the day it
          # starts lying. A degraded API answering `[]` is still
          # indistinguishable from a quiet week — nothing inside this step can
          # tell those two apart, and this does not claim to.
          if [ "$N" -eq 0 ]; then
            echo "No open PRs targeting $GITHUB_REF_NAME."
            exit 0
          fi

          # `wc -l`, not `grep -c . || true`: that `|| true` is needed because
          # grep exits 1 on a zero count, but it also swallows grep exiting 2,
          # which leaves TOTAL empty and silently disables the accounting guard
          # at the bottom of this step.
          TOTAL=$(printf '%s\n' "$PRS" | wc -l | tr -d '[:space:]')
          # The rows are only worth acting on if there is one per PR gh listed.
          # The assertion at the foot of this step cannot stand in for this one:
          # a field carrying a newline splits an element into two rows that can
          # both parse, and three rows reaching three terminal counters is
          # balanced accounting over refs no PR ever had.
          if [ "$TOTAL" -ne "$N" ]; then
            echo "::error::gh listed $N open PR(s) but the projection produced $TOTAL row(s) — the rows do not correspond to the PRs that were listed."
            exit 1
          fi
          # The one truncation nothing here can measure: TOTAL, the count gh
          # returned and the assertion at the foot of this step all describe
          # the rows that came back, never the PRs past them. Kept as a warning
          # for that reason — it is the only surface truncation has — but it
          # states the limit rather than asserting PRs were missed: a count
          # equal to the cap is not evidence that anything was cut off, and
          # above the cap the number missed is unknowable from here.
          if [ "$TOTAL" -ge "$PR_LIMIT" ]; then
            echo "::warning::Listed $TOTAL open PR(s), the --limit $PR_LIMIT this step asks for. Any PRs past that limit were not refreshed and nothing here can say how many there are."
          fi

          UPTODATE=0
          BEHIND=0
          RERAN=0
          NO_RUN=0
          NO_JOB=0
          REJECTED=0
          FAILED=0

          # Read the PR list on fd 3 so a loop-body command that reads stdin cannot
          # drain it and silently reduce the loop to a single iteration.
          while read -r PR BASE SHA <&3; do
            if [ -z "$PR" ] || [ -z "$BASE" ] || [ -z "$SHA" ]; then
              echo "::warning::Skipping malformed PR row: '$PR $BASE $SHA'"
              continue
            fi

            # `behind_by > 0` is exactly rebase-check's own `"$MERGE_BASE" !=
            # "$BASE_SHA"` guard, so this is one field, not a second copy of the
            # merge-base logic. It is that one guard, not the whole job: ci.yml's
            # step has further guards — no common ancestor, merge commits above
            # the base — so `behind_by == 0` does NOT imply rebase-check would
            # pass. That costs this gate nothing: a branch tripping another guard
            # is already red, and the base only advances, so re-running would
            # learn nothing new about the branch's shape.
            #
            # Both sides must be measured against the SAME base: ci.yml resolves
            # `origin/$BASE_REF` per PR, so this compares against `$BASE` — the
            # PR's own `baseRefName` — rather than a hardcoded `main` that only
            # agrees while the list above stays filtered to base main.
            if ! BEHIND_BY=$(gh api "repos/$GH_REPO/compare/$BASE...$SHA" --jq '.behind_by' </dev/null); then
              echo "::error::#$PR ($SHA): failed to compare against $BASE — see gh error above."
              FAILED=$((FAILED + 1))
              continue
            fi
            # `gh api --jq` exits 0 printing the literal `null` when the field
            # is absent, and `[ null -eq 0 ]` is not an abort — `set -e` is
            # suspended inside an `if` condition, so bash prints `integer
            # expression expected`, the test reads FALSE, and the PR falls
            # through to the rerun branch. That re-runs a PR nothing established
            # to be behind, which is the one thing the behind_by gate exists to
            # prevent.
            case "$BEHIND_BY" in
              ''|*[!0-9]*)
                echo "::error::#$PR ($SHA): compare returned a non-numeric behind_by ('$BEHIND_BY') — treating as an API failure, not as behind."
                FAILED=$((FAILED + 1))
                continue ;;
            esac
            if [ "$BEHIND_BY" -eq 0 ]; then
              echo "#$PR ($SHA): up to date with $BASE — nothing to refresh."
              UPTODATE=$((UPTODATE + 1))
              continue
            fi
            BEHIND=$((BEHIND + 1))

            # Runs for this PR's current head. `per_page=5` rather than 1 because
            # ci.yml sets `cancel-in-progress: true`, so the newest run is often a
            # cancelled stub with no jobs at all — taking only the newest would
            # exclude that PR permanently, since every later push re-resolves the
            # same stub. Ordering is created-descending in practice; GitHub does
            # not document a guarantee, hence the walk rather than an index.
            if ! RUNS_JSON=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$SHA&per_page=5" </dev/null); then
              echo "::error::#$PR ($SHA): failed to query CI runs — see gh error above. This is an API failure, not a missing run."
              FAILED=$((FAILED + 1))
              continue
            fi
            RUN_IDS=$(printf '%s' "$RUNS_JSON" \
              | jq -r '.workflow_runs[] | select(.conclusion != "cancelled" and .conclusion != "skipped") | .id')

            if [ -z "$RUN_IDS" ]; then
              echo "#$PR ($SHA): behind by $BEHIND_BY but no usable CI run found — skipping."
              NO_RUN=$((NO_RUN + 1))
              continue
            fi

            # The whole `$RUN_IDS` page is handed over, not just the first run
            # holding a rebase-check job. `per_page=5` exists to have the older,
            # already-completed runs in hand, and the rerun endpoint rejects a
            # job whose parent run is still in progress — so the fallback the
            # page was fetched for only happens if the POST is tried per
            # candidate rather than once after the search (#159). Unquoted on
            # purpose: the ids are newline-separated digits and each must become
            # its own argument.
            #
            # The classification comes back as an exit status, which is what
            # keeps each PR to exactly one counter incremented exactly once
            # however many candidates were tried. `|| STATUS=$?` because a
            # non-zero exit is data here, not a failure — but only for the codes
            # below: anything else (127 for a missing script, 2 for a bash
            # error) is a defect in this step, and letting it fall through as a
            # silent no-op is the vacuous green this workflow exists to end.
            STATUS=0
            .github/scripts/rerun-rebase-check.sh "$PR" "$SHA" "$BEHIND_BY" $RUN_IDS || STATUS=$?
            case "$STATUS" in
              0) RERAN=$((RERAN + 1)) ;;
              3) REJECTED=$((REJECTED + 1)) ;;
              4) NO_JOB=$((NO_JOB + 1)) ;;
              # 4's API-failure twin: no job resolved, and at least one
              # candidate's jobs listing errored, so nothing established the
              # job is absent. It lands in FAILED rather than NO_JOB so the
              # two guards at the foot of this step can see it — the script
              # has already printed the ::error:: naming the error count.
              6) FAILED=$((FAILED + 1)) ;;
              1) exit 1 ;;
              *) echo "::error::#$PR: rerun-rebase-check.sh exited $STATUS — unexpected. This is a defect in this step, not a PR that could not be refreshed."
                 exit 1 ;;
            esac
          done 3<<< "$PRS"

          SUMMARY="Checked $TOTAL open PR(s): $UPTODATE up to date, $BEHIND behind their base → $RERAN re-run (no-run: $NO_RUN, no-job: $NO_JOB, rejected: $REJECTED, failed: $FAILED)."
          echo "$SUMMARY"
          echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"

          # A row that reached no counter is a row nobody evaluated, and none of
          # the guards below can see one: an all-malformed list leaves BEHIND=0
          # and FAILED=0, so both of them read a summary of zeros as a clean
          # no-op. One assertion over the counters rather than a counter for
          # malformed rows, because a counter only covers the `continue` that
          # exists today — this covers every future one too.
          #
          # The sum is over the TERMINAL dispositions only. BEHIND is NOT one:
          # a behind PR is counted there and then again as re-run, skipped or
          # failed, so `UPTODATE + BEHIND + FAILED` reads 4 for three rows when
          # one of them is behind and then hits an API error — a warn below,
          # not a failure. Every row increments exactly one of these six.
          EVALUATED=$((UPTODATE + RERAN + NO_RUN + NO_JOB + REJECTED + FAILED))
          if [ "$EVALUATED" -ne "$TOTAL" ]; then
            echo "::error::accounting mismatch: $TOTAL PR(s) listed but $EVALUATED evaluated — rows were dropped without being counted."
            exit 1
          fi

          # Without this the workflow is green whether it refreshed everything or
          # nothing — the exact failure mode it exists to fix. The condition is
          # "something needed refreshing and none of it worked": every PR being up
          # to date is a legitimate no-op, not a failure.
          if [ "$BEHIND" -gt 0 ] && [ "$RERAN" -eq 0 ]; then
            echo "::error::$BEHIND PR(s) are behind their base but none were re-run. Check the errors above, the actions:write permission, and GH_HOST resolution."
            exit 1
          fi
          # Every PR erroring out means we learned nothing about any of them — that
          # is a broken token/host, not a quiet success, and must not exit green.
          if [ "$FAILED" -eq "$TOTAL" ] && [ "$TOTAL" -gt 0 ]; then
            echo "::error::All $TOTAL PR(s) failed to evaluate — no staleness check succeeded. Check the errors above, GH_HOST resolution, and token scopes."
            exit 1
          fi
          if [ "$FAILED" -gt 0 ]; then
            echo "::warning::$FAILED PR(s) hit API errors and may still show a stale rebase-check."
          fi
          # Without this, ONE accepted rerun clears the all-or-nothing guard
          # above and every other behind PR is laundered into a green check —
          # the stale-green this whole workflow exists to end. These are skips,
          # not errors, so they warn rather than fail.
          SKIPPED=$((NO_RUN + NO_JOB + REJECTED))
          if [ "$SKIPPED" -gt 0 ]; then
            echo "::warning::$SKIPPED behind PR(s) were not re-run (no-run: $NO_RUN, no-job: $NO_JOB, rejected: $REJECTED) and still show a stale rebase-check."
          fi
